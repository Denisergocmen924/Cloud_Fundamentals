    <rect class="c-ink" x="416" y="440" width="104" height="96" rx="4"/>
    <text class="t-note" x="468" y="496" text-anchor="middle">free</text>
    <rect class="c-ink" x="536" y="440" width="104" height="96" rx="4"/>
    <text class="t-note" x="588" y="496" text-anchor="middle">free</text>

    <!-- ===== Block B ===== -->
    <rect class="c-storage" x="960" y="272" width="496" height="288" rx="4"/>
    <text class="t-label-strong" x="1440" y="304" text-anchor="end">Block B</text>
    <rect class="c-io" x="976" y="328" width="104" height="96" rx="4"/>
    <text class="t-label" x="1028" y="368" text-anchor="middle">LBA 3</text>
    <text class="t-note" x="1028" y="400" text-anchor="middle">new</text>
    <rect class="c-ink" x="1096" y="328" width="104" height="96" rx="4"/>
    <text class="t-note" x="1148" y="384" text-anchor="middle">free</text>
    <rect class="c-ink" x="1216" y="328" width="104" height="96" rx="4"/>
