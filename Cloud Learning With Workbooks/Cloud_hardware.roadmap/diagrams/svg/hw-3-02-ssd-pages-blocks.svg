    <!-- ===== Block A ===== -->
    <rect class="c-storage" x="160" y="272" width="496" height="288" rx="4"/>
    <text class="t-label-strong" x="176" y="304">Block A</text>
    <rect class="c-ink" x="176" y="328" width="104" height="96" rx="4"/>
    <text class="t-label" x="228" y="384" text-anchor="middle">LBA 1</text>
    <rect class="c-ink" x="296" y="328" width="104" height="96" rx="4"/>
    <text class="t-label" x="348" y="384" text-anchor="middle">LBA 2</text>
    <rect class="c-software" x="416" y="328" width="104" height="96" rx="4"/>
    <text class="t-label" x="468" y="368" text-anchor="middle">LBA 3</text>
    <text class="t-note" x="468" y="400" text-anchor="middle">invalid</text>
    <rect class="c-ink" x="536" y="328" width="104" height="96" rx="4"/>
    <text class="t-label" x="588" y="384" text-anchor="middle">LBA 4</text>
    <rect class="c-ink" x="176" y="440" width="104" height="96" rx="4"/>
    <text class="t-label" x="228" y="496" text-anchor="middle">LBA 5</text>
    <rect class="c-ink" x="296" y="440" width="104" height="96" rx="4"/>
