    <rect class="c-ink" x="1336" y="328" width="104" height="96" rx="4"/>
    <text class="t-note" x="1388" y="384" text-anchor="middle">free</text>
    <rect class="c-ink" x="976" y="440" width="104" height="96" rx="4"/>
    <text class="t-note" x="1028" y="496" text-anchor="middle">free</text>
    <rect class="c-ink" x="1096" y="440" width="104" height="96" rx="4"/>
