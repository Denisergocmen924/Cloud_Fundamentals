    <line class="l-data" x1="468" y1="328" x2="468" y2="240"/>
    <line class="l-data" x1="468" y1="240" x2="1028" y2="240"/>
    <line class="l-data" x1="1028" y1="240" x2="1028" y2="326" marker-end="url(#arrow-data)"/>
    <text class="t-label" x="748" y="224" text-anchor="middle">update LBA 3 → write new page</text>

    <!-- FTL mapping table -->
    <rect class="c-software" x="688" y="328" width="240" height="96" rx="16"/>
    <text class="t-label-strong" x="808" y="368" text-anchor="middle">FTL map</text>
    <text class="t-value" x="808" y="400" text-anchor="middle">LBA 3 → B</text>
    <line class="l-async" x1="928" y1="376" x2="974" y2="376" marker-end="url(#arrow-control)"/>

    <!-- operation granularity -->
    <text class="t-label-strong" x="160" y="632">Read and write: one page</text>
    <text class="t-value" x="640" y="632">4–16 KiB</text>
    <text class="t-label-strong" x="160" y="680">Erase: whole block</text>
