  <!-- ===== content (§4: x 64–1536, y 184–1112) ===== -->
  <g id="content">
    <!-- Spine = "no" path (cheapest check first). Diamond = question, right box = bottleneck class when "yes". -->
    <rect class="c-ink" x="400" y="192" width="320" height="56" rx="16"/>
    <text class="t-label-strong" x="560" y="226" text-anchor="middle">My application is slow</text>
    <line class="l-data" x1="560" y1="248" x2="560" y2="278" marker-end="url(#arrow-data)"/>
    <path class="c-ink" d="M560,280 L752,328 L560,376 L368,328 Z"/>
    <text class="t-label" x="560" y="334" text-anchor="middle">us high?</text>
    <line class="l-data" x1="752" y1="328" x2="894" y2="328" marker-end="url(#arrow-data)"/>
    <text class="t-label" x="824" y="312" text-anchor="middle">yes</text>
    <rect class="c-compute" x="896" y="296" width="320" height="64" rx="16"/>
    <text class="t-label-strong" x="1056" y="334" text-anchor="middle">CPU bound</text>
    <text class="t-label-strong" x="64" y="324">Step 1: CPU</text>
    <text class="t-value" x="64" y="352">top, mpstat</text>
    <line class="l-data" x1="560" y1="376" x2="560" y2="406" marker-end="url(#arrow-data)"/>
    <text class="t-label" x="576" y="400">no</text>
    <path class="c-ink" d="M560,408 L752,456 L560,504 L368,456 Z"/>
    <text class="t-label" x="560" y="462" text-anchor="middle">wa high?</text>
    <line class="l-data" x1="752" y1="456" x2="894" y2="456" marker-end="url(#arrow-data)"/>
    <text class="t-label" x="824" y="440" text-anchor="middle">yes</text>
    <rect class="c-storage" x="896" y="424" width="320" height="64" rx="16"/>
    <text class="t-label-strong" x="1056" y="462" text-anchor="middle">I/O bound</text>
    <line class="l-data" x1="560" y1="504" x2="560" y2="534" marker-end="url(#arrow-data)"/>
    <text class="t-label" x="576" y="528">no</text>
    <path class="c-ink" d="M560,536 L752,584 L560,632 L368,584 Z"/>
    <text class="t-label" x="560" y="590" text-anchor="middle">st high?</text>
    <line class="l-data" x1="752" y1="584" x2="894" y2="584" marker-end="url(#arrow-data)"/>
    <text class="t-label" x="824" y="568" text-anchor="middle">yes</text>
    <rect class="c-ink" x="896" y="552" width="320" height="64" rx="16"/>
    <text class="t-label-strong" x="1056" y="590" text-anchor="middle">Noisy neighbor or credits</text>
    <line class="l-data" x1="560" y1="632" x2="560" y2="662" marker-end="url(#arrow-data)"/>
    <text class="t-label" x="576" y="656">no</text>
    <path class="c-ink" d="M560,664 L752,712 L560,760 L368,712 Z"/>
    <text class="t-label" x="560" y="718" text-anchor="middle">available low or swap?</text>
    <line class="l-data" x1="752" y1="712" x2="894" y2="712" marker-end="url(#arrow-data)"/>
    <text class="t-label" x="824" y="696" text-anchor="middle">yes</text>
    <rect class="c-memory" x="896" y="680" width="320" height="64" rx="16"/>
    <text class="t-label-strong" x="1056" y="718" text-anchor="middle">Memory bound</text>
    <text class="t-label-strong" x="64" y="708">Step 2: Memory</text>
    <text class="t-value" x="64" y="736">free -h, vmstat</text>
    <line class="l-data" x1="560" y1="760" x2="560" y2="790" marker-end="url(#arrow-data)"/>
    <text class="t-label" x="576" y="784">no</text>
    <path class="c-ink" d="M560,792 L752,840 L560,888 L368,840 Z"/>
    <text class="t-label" x="560" y="846" text-anchor="middle">await and aqu-sz high?</text>
    <line class="l-data" x1="752" y1="840" x2="894" y2="840" marker-end="url(#arrow-data)"/>
    <text class="t-label" x="824" y="824" text-anchor="middle">yes</text>
    <rect class="c-storage" x="896" y="808" width="320" height="64" rx="16"/>
    <text class="t-label-strong" x="1056" y="846" text-anchor="middle">I/O bound</text>
    <text class="t-label-strong" x="64" y="836">Step 3: Disk</text>
    <text class="t-value" x="64" y="864">iostat -x 1</text>
    <line class="l-data" x1="560" y1="888" x2="560" y2="918" marker-end="url(#arrow-data)"/>
    <text class="t-label" x="576" y="912">no</text>
    <path class="c-ink" d="M560,920 L752,968 L560,1016 L368,968 Z"/>
    <text class="t-label" x="560" y="974" text-anchor="middle">Link at its ceiling?</text>
    <line class="l-data" x1="752" y1="968" x2="894" y2="968" marker-end="url(#arrow-data)"/>
    <text class="t-label" x="824" y="952" text-anchor="middle">yes</text>
    <rect class="c-network" x="896" y="936" width="320" height="64" rx="16"/>
    <text class="t-label-strong" x="1056" y="974" text-anchor="middle">Network bound</text>
    <text class="t-label-strong" x="64" y="964">Step 4: Network</text>
    <text class="t-value" x="64" y="992">sar -n DEV 1</text>
    <line class="l-data" x1="560" y1="1016" x2="560" y2="1062" marker-end="url(#arrow-data)"/>
    <text class="t-label" x="576" y="1048">no</text>
    <rect class="c-ink" x="400" y="1064" width="320" height="48" rx="16"/>
    <text class="t-label-strong" x="560" y="1095" text-anchor="middle">Waiting bound</text>
    <text class="t-note" x="896" y="1095">No resource is full: look at the application.</text>
  </g>

