    /* ---------- Domain colors (§8.2) — same meaning in every subject ---------- */
    .c-compute  { fill: #DBEAFE; stroke: #1D4ED8; stroke-width: 2; }
    .c-memory   { fill: #DCFCE7; stroke: #15803D; stroke-width: 2; }
    .c-storage  { fill: #FFEDD5; stroke: #C2410C; stroke-width: 2; }
    .c-io       { fill: #FEF9C3; stroke: #A16207; stroke-width: 2; }
