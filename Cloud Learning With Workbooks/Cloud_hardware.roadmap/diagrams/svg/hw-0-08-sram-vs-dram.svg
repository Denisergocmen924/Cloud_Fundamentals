    </marker>
    <marker id="arrow-control" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#111827"/>
    </marker>
    <marker id="arrow-problem" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L16,8 L0,16 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- ===== background ===== -->
  <g id="background">
    <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  </g>

  <!-- ===== title (§5.1) ===== -->
  <g id="title">
    <text class="t-title" x="64" y="88">0.4.4 SRAM and DRAM</text>
    <text class="t-subtitle" x="64" y="132">Six transistors vs one</text>
    <text class="t-fig" x="1536" y="88" text-anchor="end">Figure 0.8</text>
    <line class="l-rule" x1="64" y1="160" x2="1536" y2="160"/>
  </g>

  <!-- ===== content (§4: x 64–1536, y 184–812) ===== -->
  <g id="content">
    <!-- Cell boxes show relative area (SRAM cell larger). Right panel mirrors left panel rows. -->

    <line class="s-boundary" x1="800" y1="184" x2="800" y2="812"/>

    <!-- ========== Left: SRAM ========== -->
    <text class="t-label-strong" x="400" y="232" text-anchor="middle">SRAM cell</text>

    <rect class="c-memory" x="144" y="280" width="512" height="312" rx="4"/>
    <!-- inverter 1 (points right) -->
    <path class="c-ink" d="M360,360 L416,392 L360,424 Z"/>
    <circle class="c-ink" cx="424" cy="392" r="8"/>
    <!-- inverter 2 (points left) -->
    <path class="c-ink" d="M440,456 L384,488 L440,520 Z"/>
    <circle class="c-ink" cx="376" cy="488" r="8"/>
    <!-- cross-coupling wires -->
    <line class="l-control" x1="432" y1="392" x2="480" y2="392"/>
    <line class="l-control" x1="480" y1="392" x2="480" y2="488"/>
    <line class="l-control" x1="480" y1="488" x2="440" y2="488"/>
    <line class="l-control" x1="368" y1="488" x2="320" y2="488"/>
    <line class="l-control" x1="320" y1="488" x2="320" y2="392"/>
    <line class="l-control" x1="320" y1="392" x2="360" y2="392"/>
    <circle class="s-dot" cx="320" cy="392" r="6"/>
    <circle class="s-dot" cx="480" cy="392" r="6"/>
    <!-- access transistors -->
    <line class="l-control" x1="256" y1="392" x2="320" y2="392"/>
    <line class="l-control" x1="480" y1="392" x2="544" y2="392"/>
    <rect class="c-ink" x="192" y="368" width="64" height="48" rx="4"/>
    <text class="t-label-strong" x="224" y="400" text-anchor="middle">T</text>
    <rect class="c-ink" x="544" y="368" width="64" height="48" rx="4"/>
    <text class="t-label-strong" x="576" y="400" text-anchor="middle">T</text>
    <text class="t-note" x="400" y="560" text-anchor="middle">2 inverters + 2 access transistors</text>

    <text class="t-label-strong" x="400" y="632" text-anchor="middle">6 transistors</text>

    <text class="t-label" x="144" y="680">Access</text>
    <text class="t-value" x="352" y="680">~0.5–2 ns</text>
    <text class="t-label" x="144" y="720">Density</text>
    <text class="t-label" x="352" y="720">Low</text>
    <text class="t-label" x="144" y="760">Cost per bit</text>
    <text class="t-label" x="352" y="760">High</text>
    <text class="t-label" x="144" y="800">Refresh</text>
    <text class="t-label" x="352" y="800">No</text>

    <!-- ========== Right: DRAM ========== -->
    <text class="t-label-strong" x="1168" y="232" text-anchor="middle">DRAM cell</text>

    <rect class="c-memory" x="1024" y="416" width="288" height="176" rx="4"/>
    <line class="l-control" x1="1152" y1="504" x2="1216" y2="504"/>
    <rect class="c-ink" x="1088" y="480" width="64" height="48" rx="4"/>
    <text class="t-label-strong" x="1120" y="512" text-anchor="middle">T</text>
    <!-- capacitor: two plates -->
    <line class="l-data" x1="1216" y1="472" x2="1216" y2="536"/>
    <line class="l-data" x1="1240" y1="472" x2="1240" y2="536"/>
    <line class="l-control" x1="1240" y1="504" x2="1280" y2="504"/>
    <text class="t-note" x="1228" y="568" text-anchor="middle">capacitor</text>

    <text class="t-label-strong" x="1168" y="632" text-anchor="middle">1 transistor + 1 capacitor</text>

    <text class="t-label" x="912" y="680">Access</text>
    <text class="t-value" x="1120" y="680">~50–90 ns</text>
    <text class="t-label" x="912" y="720">Density</text>
    <text class="t-label" x="1120" y="720">High</text>
    <text class="t-label" x="912" y="760">Cost per bit</text>
    <text class="t-label" x="1120" y="760">Low</text>
    <text class="t-label" x="912" y="800">Refresh</text>
    <text class="t-label" x="1120" y="800">Yes</text>

    <text class="t-note" x="1168" y="392" text-anchor="middle">Smaller cell = more bits per chip</text>
  </g>

