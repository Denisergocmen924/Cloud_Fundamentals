    <text class="t-label-strong" x="424" y="224" text-anchor="middle">Traditional</text>
    <text class="t-label-strong" x="1176" y="224" text-anchor="middle">Nitro</text>

    <!-- ===== traditional ===== -->
    <rect class="c-software" x="96" y="272" width="152" height="64" rx="16"/>
    <text class="t-label" x="172" y="310" text-anchor="middle">VM 1</text>
    <rect class="c-software" x="256" y="272" width="152" height="64" rx="16"/>
    <text class="t-label" x="332" y="310" text-anchor="middle">VM 2</text>
    <rect class="c-software" x="416" y="272" width="152" height="64" rx="16"/>
    <text class="t-label" x="492" y="310" text-anchor="middle">VM 3</text>
    <rect class="c-software" x="576" y="272" width="152" height="64" rx="16"/>
    <text class="t-label" x="652" y="310" text-anchor="middle">VM 4</text>

    <rect class="c-virt" x="96" y="352" width="632" height="136" rx="16"/>
    <text class="t-label-strong" x="412" y="400" text-anchor="middle">Hypervisor</text>
