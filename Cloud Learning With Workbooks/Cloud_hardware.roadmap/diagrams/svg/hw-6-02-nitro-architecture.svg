    <text class="t-label" x="412" y="460" text-anchor="middle">management, security</text>

    <rect class="c-compute" x="96" y="504" width="632" height="64" rx="4"/>
    <text class="t-label-strong" x="412" y="542" text-anchor="middle">Hardware</text>

    <text class="t-label-strong t-problem" x="412" y="624" text-anchor="middle">Hypervisor eats 20–30% of the CPU</text>
    <rect class="c-problem" x="96" y="648" width="158" height="48"/>
    <text class="t-value" x="175" y="678" text-anchor="middle">20–30%</text>
    <rect class="c-software" x="254" y="648" width="474" height="48"/>
    <text class="t-label" x="491" y="678" text-anchor="middle">VMs</text>
    <text class="t-note" x="412" y="728" text-anchor="middle">main CPU time</text>

    <!-- ===== Nitro ===== -->
    <rect class="c-software" x="848" y="272" width="86" height="64" rx="16"/>
    <text class="t-label" x="891" y="310" text-anchor="middle">VM 1</text>
