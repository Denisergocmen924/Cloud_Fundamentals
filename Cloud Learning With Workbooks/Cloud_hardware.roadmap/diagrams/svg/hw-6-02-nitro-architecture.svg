    <text class="t-label" x="1400" y="356" text-anchor="middle">Network (ENA)</text>
    <rect class="c-ink" x="1280" y="384" width="240" height="44" rx="4"/>
    <text class="t-label" x="1400" y="412" text-anchor="middle">Storage (EBS)</text>
    <rect class="c-ink" x="1280" y="440" width="240" height="44" rx="4"/>
