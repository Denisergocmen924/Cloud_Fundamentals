<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">

  <style>
    /* ---------- Text (§7) ---------- */
    text { font-family: "Noto Sans", "DejaVu Sans", sans-serif; fill: #111827; }
    .t-title        { font-size: 40px; font-weight: 700; }
    .t-subtitle     { font-size: 26px; font-weight: 400; fill: #4B5563; }
    .t-fig          { font-size: 24px; font-weight: 600; fill: #4B5563; }
    .t-label        { font-size: 24px; font-weight: 400; }
    .t-label-strong { font-size: 24px; font-weight: 600; }
    .t-value        { font-size: 22px; font-weight: 400; font-family: "Noto Sans Mono", "DejaVu Sans Mono", monospace; }
    .t-note         { font-size: 20px; font-weight: 400; fill: #4B5563; }
    .t-sign         { font-size: 20px; font-weight: 400; fill: #6B7280; }
    .t-problem      { fill: #DC2626; }

    /* ---------- Domain colors (§8.2) — same meaning in every subject ---------- */
    .c-compute  { fill: #DBEAFE; stroke: #1D4ED8; stroke-width: 2; }
    .c-memory   { fill: #DCFCE7; stroke: #15803D; stroke-width: 2; }
    .c-storage  { fill: #FFEDD5; stroke: #C2410C; stroke-width: 2; }
    .c-io       { fill: #FEF9C3; stroke: #A16207; stroke-width: 2; }
    .c-network  { fill: #EDE9FE; stroke: #6D28D9; stroke-width: 2; }
    .c-virt     { fill: #CCFBF1; stroke: #0F766E; stroke-width: 2; }
    .c-security { fill: #FCE7F3; stroke: #9D174D; stroke-width: 2; }
    .c-software { fill: #F3F4F6; stroke: #374151; stroke-width: 2; }
    .c-ink      { fill: #FFFFFF; stroke: #111827; stroke-width: 2; }
    .c-problem  { fill: #FEE2E2; stroke: #DC2626; stroke-width: 2; }

    /* ---------- Shapes (§9) ---------- */
    .s-boundary { fill: none; stroke: #6B7280; stroke-width: 2; stroke-dasharray: 8 6; }
    .s-unit     { fill: #374151; stroke: none; }
    .s-dot      { fill: #111827; stroke: none; }

    /* ---------- Lines (§10) ---------- */
    .l-data    { fill: none; stroke: #111827; stroke-width: 4; }
    .l-control { fill: none; stroke: #111827; stroke-width: 2; }
    .l-async   { fill: none; stroke: #111827; stroke-width: 2; stroke-dasharray: 6 4; }
    .l-problem { fill: none; stroke: #DC2626; stroke-width: 4; }
    .l-plain   { fill: none; stroke: #374151; stroke-width: 2; }
    .l-rule    { fill: none; stroke: #E5E7EB; stroke-width: 2; }
    .l-guide   { fill: none; stroke: #E5E7EB; stroke-width: 2; }
  </style>

  <defs>
    <marker id="arrow-data" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L16,8 L0,16 z" fill="#111827"/>
    </marker>
    <marker id="arrow-control" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#111827"/>
    </marker>
    <marker id="arrow-problem" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L16,8 L0,16 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- ===== background ===== -->
  <g id="background">
    <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  </g>

  <!-- ===== title (§5.1) ===== -->
  <g id="title">
    <text class="t-title" x="64" y="88">0.1.1 Why does a computer count in binary?</text>
    <text class="t-subtitle" x="64" y="132">Noise margin: binary vs decimal</text>
    <text class="t-fig" x="1536" y="88" text-anchor="end">Figure 0.1</text>
    <line class="l-rule" x1="64" y1="160" x2="1536" y2="160"/>
  </g>

  <!-- ===== content (§4: x 64–1536, y 184–812) ===== -->
  <g id="content">
    <!-- scale: 0 V = y 760, 1 V = 150 px (both panels) -->

    <!-- Comparison divider -->
    <line class="s-boundary" x1="800" y1="184" x2="800" y2="812"/>

    <!-- ========== Left: decimal (problem side) ========== -->
    <text class="t-label-strong" x="356" y="224" text-anchor="middle">Decimal · 10 levels</text>

    <!-- Levels 0–9, 0.33 V apart: y = 760 − n × 49.5 -->
    <line class="l-plain" x1="152" y1="760" x2="472" y2="760"/>
    <line class="l-plain" x1="152" y1="710" x2="472" y2="710"/>
    <line class="l-plain" x1="152" y1="661" x2="472" y2="661"/>
    <line class="l-plain" x1="152" y1="612" x2="472" y2="612"/>
    <line class="l-plain" x1="152" y1="562" x2="472" y2="562"/>
    <line class="l-plain" x1="152" y1="512" x2="560" y2="512"/>
    <line class="l-plain" x1="152" y1="463" x2="472" y2="463"/>
    <line class="l-plain" x1="152" y1="414" x2="472" y2="414"/>
    <line class="l-plain" x1="152" y1="364" x2="472" y2="364"/>
    <line class="l-plain" x1="152" y1="314" x2="472" y2="314"/>

    <text class="t-value" x="128" y="768" text-anchor="end">0</text>
    <text class="t-value" x="128" y="718" text-anchor="end">1</text>
    <text class="t-value" x="128" y="669" text-anchor="end">2</text>
    <text class="t-value" x="128" y="620" text-anchor="end">3</text>
    <text class="t-value" x="128" y="570" text-anchor="end">4</text>
    <text class="t-value" x="128" y="520" text-anchor="end">5</text>
    <text class="t-value" x="128" y="471" text-anchor="end">6</text>
    <text class="t-value" x="128" y="422" text-anchor="end">7</text>
    <text class="t-value" x="128" y="372" text-anchor="end">8</text>
    <text class="t-value" x="128" y="322" text-anchor="end">9</text>

    <!-- Halfway between 5 and 6 (5.5 × 0.33 V = y 488) -->
    <line class="s-boundary" x1="408" y1="488" x2="456" y2="488"/>
    <text class="t-note" x="392" y="495" text-anchor="end">halfway</text>

    <!-- 0.2 V drift = 30 px: passes halfway -->
    <line class="l-problem" x1="432" y1="512" x2="432" y2="482" marker-end="url(#arrow-problem)"/>
    <text class="t-value t-problem" x="488" y="494">0.2 V</text>

    <!-- Sent 5, read as 6 -->
    <line class="l-problem" x1="472" y1="463" x2="560" y2="463"/>
    <text class="t-label t-problem" x="576" y="471">Read as 6</text>
    <text class="t-label" x="576" y="520">Sent: 5</text>

    <text class="t-note" x="152" y="800">Levels are 0.33 V apart</text>

    <!-- ========== Right: binary ========== -->
    <text class="t-label-strong" x="1120" y="224" text-anchor="middle">Binary · 2 levels</text>

    <!-- Voltage axis -->
    <line class="l-plain" x1="928" y1="760" x2="928" y2="265"/>
    <line class="l-plain" x1="920" y1="760" x2="936" y2="760"/>
    <line class="l-plain" x1="920" y1="610" x2="936" y2="610"/>
    <line class="l-plain" x1="920" y1="415" x2="936" y2="415"/>
    <line class="l-plain" x1="920" y1="265" x2="936" y2="265"/>
    <text class="t-value" x="912" y="768" text-anchor="end">0 V</text>
    <text class="t-value" x="912" y="618" text-anchor="end">1.0 V</text>
    <text class="t-value" x="912" y="423" text-anchor="end">2.3 V</text>
    <text class="t-value" x="912" y="273" text-anchor="end">3.3 V</text>

    <!-- Bands: "1" 2.3–3.3 V, forbidden 1.0–2.3 V, "0" 0–1.0 V -->
    <rect class="c-ink" x="960" y="265" width="320" height="150" rx="4"/>
    <rect class="c-software" x="960" y="415" width="320" height="195" rx="4"/>
    <rect class="c-ink" x="960" y="610" width="320" height="150" rx="4"/>

    <text class="t-label-strong" x="1120" y="349" text-anchor="middle">1</text>
    <text class="t-label-strong" x="1120" y="506" text-anchor="middle">Forbidden zone</text>
    <text class="t-value" x="1120" y="540" text-anchor="middle">1.3 V</text>
    <text class="t-label-strong" x="1120" y="694" text-anchor="middle">0</text>

    <!-- Signal sent at 3.3 V, drifts 0.4 V = 60 px, stays above 2.3 V -->
    <circle class="s-dot" cx="1312" cy="265" r="6"/>
    <line class="l-data" x1="1312" y1="265" x2="1312" y2="325" marker-end="url(#arrow-data)"/>
    <line class="s-boundary" x1="1288" y1="415" x2="1336" y2="415"/>
    <text class="t-label" x="1336" y="273">Sent at 3.3 V</text>
    <text class="t-value" x="1336" y="306">0.4 V drift</text>
    <text class="t-note" x="1336" y="348">Still read as 1</text>

    <text class="t-note" x="960" y="800">Wide forbidden zone = high noise tolerance</text>
  </g>

  <!-- ===== footer (§5.2) — do not change ===== -->
  <g id="footer">
    <line class="l-rule" x1="64" y1="836" x2="1536" y2="836"/>
    <text class="t-sign" x="64" y="876" xml:space="preserve">Created by Denis Ergöçmen    GitHub: https://github.com/Denisergocmen924</text>
  </g>

</svg>
