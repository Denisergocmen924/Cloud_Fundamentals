  <!-- ===== content (§4: x 64–1536, y 184–812) ===== -->
  <g id="content">
    <!-- Left: hub copies A's frame to every port. Right: switch sends A→B and C→D at the same time. -->
    <line class="s-boundary" x1="800" y1="184" x2="800" y2="812"/>
    <text class="t-label-strong" x="424" y="224" text-anchor="middle">Hub (old)</text>
    <text class="t-label-strong" x="1176" y="224" text-anchor="middle">Switch (modern)</text>

    <!-- ===== hub ===== -->
    <rect class="c-ink" x="96" y="420" width="112" height="56" rx="4"/>
    <text class="t-label-strong" x="152" y="454" text-anchor="middle">A</text>
    <line class="l-data" x1="208" y1="448" x2="334" y2="448" marker-end="url(#arrow-data)"/>
    <text class="t-label" x="272" y="432" text-anchor="middle">sends</text>

    <rect class="c-network" x="336" y="408" width="160" height="80" rx="4"/>
    <text class="t-label-strong" x="416" y="454" text-anchor="middle">Hub</text>

    <line class="l-data" x1="496" y1="448" x2="536" y2="448"/>
    <line class="l-data" x1="536" y1="316" x2="536" y2="580"/>
    <line class="l-data" x1="536" y1="316" x2="582" y2="316" marker-end="url(#arrow-data)"/>
    <line class="l-data" x1="536" y1="448" x2="582" y2="448" marker-end="url(#arrow-data)"/>
    <line class="l-data" x1="536" y1="580" x2="582" y2="580" marker-end="url(#arrow-data)"/>

    <rect class="c-ink" x="584" y="288" width="96" height="56" rx="4"/>
    <text class="t-label-strong" x="632" y="322" text-anchor="middle">B</text>
    <text class="t-label" x="696" y="322">wanted</text>
    <rect class="c-ink" x="584" y="420" width="96" height="56" rx="4"/>
    <text class="t-label-strong" x="632" y="454" text-anchor="middle">C</text>
    <text class="t-label" x="696" y="454">copy</text>
    <rect class="c-ink" x="584" y="552" width="96" height="56" rx="4"/>
    <text class="t-label-strong" x="632" y="586" text-anchor="middle">D</text>
    <text class="t-label" x="696" y="586">copy</text>

    <text class="t-label-strong t-problem" x="424" y="696" text-anchor="middle">Two talk at once: collision</text>
    <text class="t-label" x="424" y="736" text-anchor="middle">All ports share the bandwidth</text>

    <!-- ===== switch ===== -->
    <rect class="c-ink" x="864" y="288" width="96" height="56" rx="4"/>
    <text class="t-label-strong" x="912" y="322" text-anchor="middle">A</text>
    <rect class="c-ink" x="864" y="552" width="96" height="56" rx="4"/>
    <text class="t-label-strong" x="912" y="586" text-anchor="middle">C</text>

    <rect class="c-network" x="1088" y="408" width="160" height="80" rx="4"/>
    <text class="t-label-strong" x="1168" y="442" text-anchor="middle">Switch</text>
    <text class="t-note" x="1168" y="470" text-anchor="middle">MAC table</text>

    <rect class="c-ink" x="1376" y="288" width="96" height="56" rx="4"/>
    <text class="t-label-strong" x="1424" y="322" text-anchor="middle">B</text>
    <rect class="c-ink" x="1376" y="552" width="96" height="56" rx="4"/>
    <text class="t-label-strong" x="1424" y="586" text-anchor="middle">D</text>

    <line class="l-data" x1="960" y1="316" x2="1120" y2="316"/>
    <line class="l-data" x1="1120" y1="316" x2="1120" y2="406" marker-end="url(#arrow-data)"/>
    <line class="l-data" x1="1216" y1="408" x2="1216" y2="316"/>
    <line class="l-data" x1="1216" y1="316" x2="1374" y2="316" marker-end="url(#arrow-data)"/>
    <text class="t-label" x="1040" y="300" text-anchor="middle">A → B</text>

    <line class="l-data" x1="960" y1="580" x2="1120" y2="580"/>
    <line class="l-data" x1="1120" y1="580" x2="1120" y2="490" marker-end="url(#arrow-data)"/>
    <line class="l-data" x1="1216" y1="488" x2="1216" y2="580"/>
    <line class="l-data" x1="1216" y1="580" x2="1374" y2="580" marker-end="url(#arrow-data)"/>
    <text class="t-label" x="1040" y="564" text-anchor="middle">C → D</text>

    <text class="t-label-strong" x="1176" y="696" text-anchor="middle">Both at once, no collision</text>
    <text class="t-label" x="1176" y="736" text-anchor="middle">Each port has its own bandwidth</text>
