    <text class="t-value" x="848" y="608" text-anchor="middle">1</text>
    <text class="t-value" x="688" y="656" text-anchor="middle">1</text>
    <text class="t-value" x="752" y="656" text-anchor="middle">0</text>
    <text class="t-value" x="848" y="656" text-anchor="middle">1</text>
