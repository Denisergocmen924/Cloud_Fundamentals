  <!-- ===== background ===== -->
  <g id="background">
    <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  </g>

  <!-- ===== title (§5.1) ===== -->
  <g id="title">
    <text class="t-title" x="64" y="88">0.2.1 A transistor is a switch</text>
    <text class="t-subtitle" x="64" y="132">MOSFET: off and on</text>
    <text class="t-fig" x="1536" y="88" text-anchor="end">Figure 0.2</text>
    <line class="l-rule" x1="64" y1="160" x2="1536" y2="160"/>
  </g>

  <!-- ===== content (§4: x 64–1536, y 184–812) ===== -->
  <g id="content">
    <!-- Right panel = left panel shifted +768 px. Thin line = small control signal, thick line = large current. -->

    <!-- Comparison divider -->
    <line class="s-boundary" x1="800" y1="184" x2="800" y2="812"/>

    <!-- ========== Left: off state (0) ========== -->
    <text class="t-label-strong" x="416" y="232" text-anchor="middle">Off state (0)</text>

    <!-- Gate: no voltage -->
    <circle class="s-dot" cx="416" cy="344" r="6"/>
    <line class="l-plain" x1="416" y1="344" x2="416" y2="424"/>
    <text class="t-label" x="440" y="392">No voltage</text>
    <rect class="c-ink" x="336" y="424" width="160" height="64" rx="4"/>
    <text class="t-label-strong" x="416" y="464" text-anchor="middle">Gate</text>

    <!-- Source, channel, drain -->
    <line class="l-plain" x1="80" y1="560" x2="128" y2="560"/>
    <rect class="c-ink" x="128" y="512" width="160" height="96" rx="4"/>
    <text class="t-label-strong" x="208" y="568" text-anchor="middle">Source</text>
    <rect class="s-boundary" x="288" y="528" width="256" height="64"/>
    <rect class="c-ink" x="544" y="512" width="160" height="96" rx="4"/>
    <text class="t-label-strong" x="624" y="568" text-anchor="middle">Drain</text>
    <line class="l-plain" x1="704" y1="560" x2="752" y2="560"/>

    <text class="t-label" x="416" y="664" text-anchor="middle">No channel · no current</text>
    <text class="t-note" x="416" y="736" text-anchor="middle">Like a closed valve</text>

    <!-- ========== Right: on state (1) ========== -->
    <text class="t-label-strong" x="1184" y="232" text-anchor="middle">On state (1)</text>

    <!-- Gate: voltage applied -->
    <circle class="s-dot" cx="1184" cy="344" r="6"/>
    <line class="l-control" x1="1184" y1="344" x2="1184" y2="422" marker-end="url(#arrow-control)"/>
    <text class="t-label" x="1208" y="392">Voltage applied</text>
    <rect class="c-ink" x="1104" y="424" width="160" height="64" rx="4"/>
    <text class="t-label-strong" x="1184" y="464" text-anchor="middle">Gate</text>

    <!-- Source, conductive channel, drain; current enters at source, leaves at drain -->
    <line class="l-data" x1="848" y1="560" x2="894" y2="560" marker-end="url(#arrow-data)"/>
    <rect class="c-ink" x="896" y="512" width="160" height="96" rx="4"/>
    <text class="t-label-strong" x="976" y="568" text-anchor="middle">Source</text>
    <rect class="c-software" x="1056" y="528" width="256" height="64"/>
    <line class="l-data" x1="1064" y1="560" x2="1306" y2="560" marker-end="url(#arrow-data)"/>
    <rect class="c-ink" x="1312" y="512" width="160" height="96" rx="4"/>
    <text class="t-label-strong" x="1392" y="568" text-anchor="middle">Drain</text>
    <line class="l-data" x1="1472" y1="560" x2="1520" y2="560" marker-end="url(#arrow-data)"/>

    <text class="t-label" x="1184" y="664" text-anchor="middle">Channel conducts · current flows</text>
    <text class="t-note" x="1184" y="736" text-anchor="middle">Like an open valve</text>
  </g>

