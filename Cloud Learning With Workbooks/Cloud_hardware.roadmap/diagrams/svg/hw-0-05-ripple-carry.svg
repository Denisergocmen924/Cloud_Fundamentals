  <!-- ===== content (§4: x 64–1536, y 184–812) ===== -->
  <g id="content">
    <!-- Full adders in a row, bit 0 on the right. Carry-out of each bit is the carry-in of the next bit to the left. -->

    <text class="t-label" x="480" y="232" text-anchor="middle">Leftmost digit</text>
    <text class="t-label" x="1392" y="232" text-anchor="middle">Rightmost digit</text>

    <!-- ===== bit 63 (x 400–560) ===== -->
    <text class="t-label" x="448" y="304" text-anchor="middle">A₆₃</text>
    <text class="t-label" x="512" y="304" text-anchor="middle">B₆₃</text>
    <line class="l-control" x1="448" y1="320" x2="448" y2="398" marker-end="url(#arrow-control)"/>
    <line class="l-control" x1="512" y1="320" x2="512" y2="398" marker-end="url(#arrow-control)"/>
    <rect class="c-ink" x="400" y="400" width="160" height="112" rx="4"/>
    <text class="t-label-strong" x="480" y="448" text-anchor="middle">Full adder</text>
    <text class="t-note" x="480" y="480" text-anchor="middle">bit 63</text>
    <line class="l-control" x1="480" y1="512" x2="480" y2="590" marker-end="url(#arrow-control)"/>
    <text class="t-label" x="480" y="624" text-anchor="middle">S₆₃</text>

    <!-- ===== bit 2 (x 768–928) ===== -->
    <text class="t-label" x="816" y="304" text-anchor="middle">A₂</text>
    <text class="t-label" x="880" y="304" text-anchor="middle">B₂</text>
    <line class="l-control" x1="816" y1="320" x2="816" y2="398" marker-end="url(#arrow-control)"/>
    <line class="l-control" x1="880" y1="320" x2="880" y2="398" marker-end="url(#arrow-control)"/>
    <rect class="c-ink" x="768" y="400" width="160" height="112" rx="4"/>
    <text class="t-label-strong" x="848" y="448" text-anchor="middle">Full adder</text>
    <text class="t-note" x="848" y="480" text-anchor="middle">bit 2</text>
    <line class="l-control" x1="848" y1="512" x2="848" y2="590" marker-end="url(#arrow-control)"/>
    <text class="t-label" x="848" y="624" text-anchor="middle">S₂</text>

    <!-- ===== bit 1 (x 1040–1200) ===== -->
    <text class="t-label" x="1088" y="304" text-anchor="middle">A₁</text>
    <text class="t-label" x="1152" y="304" text-anchor="middle">B₁</text>
    <line class="l-control" x1="1088" y1="320" x2="1088" y2="398" marker-end="url(#arrow-control)"/>
    <line class="l-control" x1="1152" y1="320" x2="1152" y2="398" marker-end="url(#arrow-control)"/>
    <rect class="c-ink" x="1040" y="400" width="160" height="112" rx="4"/>
    <text class="t-label-strong" x="1120" y="448" text-anchor="middle">Full adder</text>
    <text class="t-note" x="1120" y="480" text-anchor="middle">bit 1</text>
    <line class="l-control" x1="1120" y1="512" x2="1120" y2="590" marker-end="url(#arrow-control)"/>
    <text class="t-label" x="1120" y="624" text-anchor="middle">S₁</text>

    <!-- ===== bit 0 (x 1312–1472) ===== -->
    <text class="t-label" x="1360" y="304" text-anchor="middle">A₀</text>
    <text class="t-label" x="1424" y="304" text-anchor="middle">B₀</text>
    <line class="l-control" x1="1360" y1="320" x2="1360" y2="398" marker-end="url(#arrow-control)"/>
    <line class="l-control" x1="1424" y1="320" x2="1424" y2="398" marker-end="url(#arrow-control)"/>
    <rect class="c-ink" x="1312" y="400" width="160" height="112" rx="4"/>
    <text class="t-label-strong" x="1392" y="448" text-anchor="middle">Full adder</text>
    <text class="t-note" x="1392" y="480" text-anchor="middle">bit 0</text>
    <line class="l-control" x1="1392" y1="512" x2="1392" y2="590" marker-end="url(#arrow-control)"/>
    <text class="t-label" x="1392" y="624" text-anchor="middle">S₀</text>

    <!-- ===== carry chain, right to left ===== -->
    <text class="t-value" x="1504" y="440" text-anchor="middle">0</text>
    <line class="l-data" x1="1528" y1="464" x2="1474" y2="464" marker-end="url(#arrow-data)"/>
