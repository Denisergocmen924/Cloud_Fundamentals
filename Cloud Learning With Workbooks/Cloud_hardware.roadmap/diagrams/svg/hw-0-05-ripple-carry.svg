    <line class="l-data" x1="1040" y1="464" x2="930" y2="464" marker-end="url(#arrow-data)"/>
    <line class="l-data" x1="768" y1="464" x2="712" y2="464"/>
    <text class="t-label-strong" x="664" y="472" text-anchor="middle">…</text>
    <line class="l-data" x1="616" y1="464" x2="562" y2="464" marker-end="url(#arrow-data)"/>
    <line class="l-data" x1="400" y1="464" x2="306" y2="464" marker-end="url(#arrow-data)"/>
    <text class="t-label" x="288" y="472" text-anchor="end">Carry out</text>

    <text class="t-note" x="480" y="688" text-anchor="middle">Waits for all 63 carries before it</text>
    <text class="t-note" x="64" y="784">Full adder: two half adders plus an OR gate.</text>
