    <text class="t-note" x="752" y="312" text-anchor="end">device limit</text>
    <line class="s-boundary" x1="752" y1="328" x2="752" y2="664"/>
    <text class="t-label" x="96" y="344">IOPS</text>
    <rect class="c-problem" x="96" y="368" width="656" height="48" rx="4"/>
    <text class="t-value" x="96" y="456">10,000 of 10,000</text>
    <text class="t-label" x="96" y="528">Throughput</text>
    <rect class="c-ink" x="96" y="552" width="656" height="48" rx="4"/>
    <rect class="c-storage" x="96" y="552" width="26" height="48" rx="4"/>
    <text class="t-value" x="96" y="640">40 of 1,000 MB/s</text>
    <text class="t-label-strong t-problem" x="424" y="712" text-anchor="middle">IOPS-bound</text>
    <text class="t-value" x="424" y="752" text-anchor="middle">10,000 × 4 KiB = 40 MB/s</text>

    <!-- ===== right ===== -->
    <text class="t-note" x="1504" y="312" text-anchor="end">device limit</text>
    <line class="s-boundary" x1="1504" y1="328" x2="1504" y2="664"/>
    <text class="t-label" x="848" y="344">IOPS</text>
    <rect class="c-ink" x="848" y="368" width="656" height="48" rx="4"/>
    <rect class="c-storage" x="848" y="368" width="66" height="48" rx="4"/>
