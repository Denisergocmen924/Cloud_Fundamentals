    <!-- Example device limits: 10,000 IOPS and 1,000 MB/s. Bar length = share of the limit used. Throughput = IOPS × I/O size. -->
    <line class="s-boundary" x1="800" y1="184" x2="800" y2="768"/>
    <text class="t-label-strong" x="424" y="224" text-anchor="middle">Small random I/O</text>
    <text class="t-note" x="424" y="256" text-anchor="middle">4 KiB each</text>
    <text class="t-label-strong" x="1176" y="224" text-anchor="middle">Large sequential I/O</text>
    <text class="t-note" x="1176" y="256" text-anchor="middle">1 MiB each</text>

