  <!-- ===== content (§4: x 64–1536, y 184–812) ===== -->
  <g id="content">
    <!-- One row per component. Numbers are examples from 5.3.2; rows are not drawn to scale. -->
    <text class="t-label-strong" x="336" y="232">Depends on</text>
    <text class="t-label-strong" x="656" y="232">How to reduce</text>
    <text class="t-label-strong" x="1024" y="232">Example</text>

    <!-- propagation -->
    <rect class="c-network" x="64" y="256" width="240" height="88" rx="4"/>
    <text class="t-label-strong" x="184" y="306" text-anchor="middle">Propagation</text>
    <text class="t-label" x="336" y="306">Distance</text>
    <text class="t-label" x="656" y="292">Move closer</text>
    <text class="t-note" x="656" y="324">CDN, edge; nothing else works</text>
    <text class="t-value" x="1024" y="292">~50,000 μs</text>
    <text class="t-label" x="1024" y="324">intercontinental</text>

    <!-- transmission -->
    <rect class="c-network" x="64" y="368" width="240" height="88" rx="4"/>
    <text class="t-label-strong" x="184" y="418" text-anchor="middle">Transmission</text>
    <text class="t-label" x="336" y="418">Packet size ÷ link speed</text>
    <text class="t-label" x="656" y="418">Faster link</text>
    <text class="t-value" x="1024" y="404">12 μs at 1 Gbps</text>
    <text class="t-value" x="1024" y="436">1.2 μs at 10 Gbps</text>

    <!-- processing -->
    <rect class="c-network" x="64" y="480" width="240" height="88" rx="4"/>
    <text class="t-label-strong" x="184" y="530" text-anchor="middle">Processing</text>
    <text class="t-label" x="336" y="530">Number of devices</text>
    <text class="t-label" x="656" y="530">Fewer hops, better hardware</text>
    <text class="t-label" x="1024" y="530">header reads per hop</text>

    <!-- queuing -->
    <rect class="c-network" x="64" y="592" width="240" height="88" rx="4"/>
    <text class="t-label-strong" x="184" y="642" text-anchor="middle">Queuing</text>
    <text class="t-label" x="336" y="642">Load and congestion</text>
    <text class="t-label-strong" x="656" y="628">Lower utilization</text>
    <text class="t-note" x="656" y="660">the most actionable part</text>
    <text class="t-label" x="1024" y="642">dominant near 95% load</text>

    <text class="t-value" x="64" y="744">Total = propagation + transmission + processing + queuing</text>
    <text class="t-note" x="64" y="792">A faster link cannot shrink 50,000 μs of distance.</text>
  </g>

