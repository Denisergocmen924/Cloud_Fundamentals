  <g id="title">
    <text class="t-title" x="64" y="88">5.3.4 Real-world latency figures</text>
    <text class="t-subtitle" x="64" y="132">Four parts of latency</text>
    <text class="t-fig" x="1536" y="88" text-anchor="end">Figure 5.2</text>
    <line class="l-rule" x1="64" y1="160" x2="1536" y2="160"/>
