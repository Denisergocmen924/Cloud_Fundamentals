    <text class="t-label" x="1152" y="344" text-anchor="middle">Queue 0</text>
    <rect class="c-io" x="1072" y="392" width="160" height="64" rx="16"/>
    <text class="t-label" x="1152" y="432" text-anchor="middle">Queue 1</text>
    <rect class="c-io" x="1072" y="480" width="160" height="64" rx="16"/>
    <text class="t-label" x="1152" y="520" text-anchor="middle">Queue 2</text>
