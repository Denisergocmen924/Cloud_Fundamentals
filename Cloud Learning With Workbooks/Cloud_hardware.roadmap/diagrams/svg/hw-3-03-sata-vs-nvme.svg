    <line class="l-data" x1="1296" y1="468" x2="1374" y2="468" marker-end="url(#arrow-data)"/>

    <rect class="c-storage" x="1376" y="404" width="128" height="128" rx="4"/>
    <text class="t-label-strong" x="1440" y="476" text-anchor="middle">SSD</text>

    <text class="t-label-strong" x="1152" y="680" text-anchor="middle">No contention</text>
    <text class="t-note" x="1152" y="712" text-anchor="middle">each core has its own queue</text>

    <text class="t-value" x="1176" y="776" text-anchor="middle">65,535 queues × depth 65,536</text>
