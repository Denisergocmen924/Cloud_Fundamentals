  <!-- ===== content (§4: x 64–1536, y 184–812) ===== -->
  <g id="content">
    <!-- Left: all cores merge into one shared queue (the problem). Right: each core owns a queue. -->
    <line class="s-boundary" x1="800" y1="184" x2="800" y2="812"/>
    <text class="t-label-strong" x="424" y="224" text-anchor="middle">SATA (AHCI)</text>
    <text class="t-label-strong" x="1176" y="224" text-anchor="middle">NVMe</text>

    <!-- ===== SATA ===== -->
    <rect class="c-compute" x="96" y="304" width="160" height="64" rx="4"/>
    <text class="t-label" x="176" y="344" text-anchor="middle">Core 0</text>
    <rect class="c-compute" x="96" y="392" width="160" height="64" rx="4"/>
    <text class="t-label" x="176" y="432" text-anchor="middle">Core 1</text>
    <rect class="c-compute" x="96" y="480" width="160" height="64" rx="4"/>
    <text class="t-label" x="176" y="520" text-anchor="middle">Core 2</text>
    <rect class="c-compute" x="96" y="568" width="160" height="64" rx="4"/>
    <text class="t-label" x="176" y="608" text-anchor="middle">Core 3</text>

    <line class="l-data" x1="256" y1="336" x2="336" y2="336"/>
    <line class="l-data" x1="256" y1="424" x2="336" y2="424"/>
    <line class="l-data" x1="256" y1="512" x2="336" y2="512"/>
    <line class="l-data" x1="256" y1="600" x2="336" y2="600"/>
    <line class="l-problem" x1="336" y1="336" x2="336" y2="600"/>
    <line class="l-data" x1="336" y1="468" x2="398" y2="468" marker-end="url(#arrow-data)"/>

    <rect class="c-io" x="400" y="408" width="184" height="120" rx="16"/>
    <text class="t-label-strong" x="492" y="456" text-anchor="middle">Single queue</text>
    <text class="t-value" x="492" y="488" text-anchor="middle">depth 32</text>

    <line class="l-data" x1="584" y1="468" x2="638" y2="468" marker-end="url(#arrow-data)"/>
    <rect class="c-storage" x="640" y="404" width="128" height="128" rx="4"/>
    <text class="t-label-strong" x="704" y="476" text-anchor="middle">SSD</text>

    <text class="t-label-strong t-problem" x="336" y="680" text-anchor="middle">Lock contention</text>
    <text class="t-note" x="336" y="712" text-anchor="middle">cores wait for each other</text>

    <text class="t-value" x="424" y="776" text-anchor="middle">1 queue × depth 32</text>

    <!-- ===== NVMe ===== -->
    <rect class="c-compute" x="848" y="304" width="160" height="64" rx="4"/>
    <text class="t-label" x="928" y="344" text-anchor="middle">Core 0</text>
    <rect class="c-compute" x="848" y="392" width="160" height="64" rx="4"/>
    <text class="t-label" x="928" y="432" text-anchor="middle">Core 1</text>
    <rect class="c-compute" x="848" y="480" width="160" height="64" rx="4"/>
