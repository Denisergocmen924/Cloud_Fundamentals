  <!-- ===== content (§4: x 64–1536, y 184–812) ===== -->
  <g id="content">
    <!-- XOR on top (sum), AND below (carry). Junction dot = wires connected; a crossing without a dot is not connected. -->

    <!-- Input A: straight to XOR, branch down to AND -->
    <text class="t-label-strong" x="184" y="312" text-anchor="end">A</text>
    <line class="l-control" x1="200" y1="304" x2="648" y2="304"/>
    <circle class="s-dot" cx="400" cy="304" r="6"/>
    <line class="l-control" x1="400" y1="304" x2="400" y2="528"/>
    <line class="l-control" x1="400" y1="528" x2="640" y2="528"/>

    <!-- Input B: straight to AND, branch up to XOR -->
    <text class="t-label-strong" x="184" y="584" text-anchor="end">B</text>
    <line class="l-control" x1="200" y1="576" x2="640" y2="576"/>
    <circle class="s-dot" cx="320" cy="576" r="6"/>
    <line class="l-control" x1="320" y1="576" x2="320" y2="352"/>
    <line class="l-control" x1="320" y1="352" x2="648" y2="352"/>

    <!-- XOR gate: OR body + extra back curve -->
    <text class="t-label-strong" x="696" y="256" text-anchor="middle">XOR</text>
    <path class="c-ink" d="M652,280 Q716,280 764,328 Q716,376 652,376 Q684,328 652,280 Z"/>
    <path class="l-control" d="M636,280 Q668,328 636,376"/>
    <line class="l-control" x1="764" y1="328" x2="880" y2="328"/>
    <text class="t-label-strong" x="896" y="336">Sum</text>

    <!-- AND gate -->
    <text class="t-label-strong" x="688" y="480" text-anchor="middle">AND</text>
    <path class="c-ink" d="M640,504 H688 A48,48 0 0 1 688,600 H640 Z"/>
    <line class="l-control" x1="736" y1="552" x2="880" y2="552"/>
    <text class="t-label-strong" x="896" y="560">Carry</text>

    <!-- Truth table -->
    <text class="t-label-strong" x="1104" y="296" text-anchor="middle">A</text>
    <text class="t-label-strong" x="1176" y="296" text-anchor="middle">B</text>
    <text class="t-label-strong" x="1296" y="296" text-anchor="middle">Sum</text>
    <text class="t-label-strong" x="1424" y="296" text-anchor="middle">Carry</text>
    <line class="l-control" x1="1064" y1="312" x2="1480" y2="312"/>
    <text class="t-value" x="1104" y="352" text-anchor="middle">0</text>
    <text class="t-value" x="1176" y="352" text-anchor="middle">0</text>
    <text class="t-value" x="1296" y="352" text-anchor="middle">0</text>
    <text class="t-value" x="1424" y="352" text-anchor="middle">0</text>
    <text class="t-value" x="1104" y="400" text-anchor="middle">0</text>
    <text class="t-value" x="1176" y="400" text-anchor="middle">1</text>
    <text class="t-value" x="1296" y="400" text-anchor="middle">1</text>
    <text class="t-value" x="1424" y="400" text-anchor="middle">0</text>
    <text class="t-value" x="1104" y="448" text-anchor="middle">1</text>
    <text class="t-value" x="1176" y="448" text-anchor="middle">0</text>
    <text class="t-value" x="1296" y="448" text-anchor="middle">1</text>
    <text class="t-value" x="1424" y="448" text-anchor="middle">0</text>
    <text class="t-value" x="1104" y="496" text-anchor="middle">1</text>
    <text class="t-value" x="1176" y="496" text-anchor="middle">1</text>
    <text class="t-value" x="1296" y="496" text-anchor="middle">0</text>
    <text class="t-value" x="1424" y="496" text-anchor="middle">1</text>

    <text class="t-value" x="1064" y="584">Sum   = A XOR B</text>
    <text class="t-value" x="1064" y="632">Carry = A AND B</text>

    <text class="t-note" x="64" y="784">The same two inputs feed both gates.</text>
  </g>

