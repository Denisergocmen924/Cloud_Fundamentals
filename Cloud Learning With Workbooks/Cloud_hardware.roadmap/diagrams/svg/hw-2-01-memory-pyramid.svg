    <text class="t-label-strong" x="64" y="208">Faster, costlier per bit</text>
    <text class="t-label-strong" x="1120" y="208">Latency</text>
    <text class="t-label-strong" x="1296" y="208">Size</text>
    <line class="l-control" x1="88" y1="1054" x2="88" y2="234" marker-start="url(#arrow-control)" marker-end="url(#arrow-control)"/>

    <rect class="c-compute" x="496" y="232" width="208" height="96" rx="4"/>
    <text class="t-label-strong" x="600" y="288" text-anchor="middle">Register</text>
    <text class="t-value" x="1120" y="288">~0.1 ns</text>
    <text class="t-value" x="1296" y="288">~1 KB</text>

    <rect class="c-memory" x="444" y="336" width="312" height="96" rx="4"/>
    <text class="t-label-strong" x="600" y="392" text-anchor="middle">L1 cache (per core)</text>
    <text class="t-value" x="1120" y="392">~1 ns</text>
    <text class="t-value" x="1296" y="392">32–48 KiB</text>

    <rect class="c-memory" x="392" y="440" width="416" height="96" rx="4"/>
    <text class="t-label-strong" x="600" y="496" text-anchor="middle">L2 cache (per core)</text>
    <text class="t-value" x="1120" y="496">~4 ns</text>
    <text class="t-value" x="1296" y="496">512 KiB – 2 MiB</text>

    <rect class="c-memory" x="340" y="544" width="520" height="96" rx="4"/>
    <text class="t-label-strong" x="600" y="600" text-anchor="middle">L3 cache (shared)</text>
    <text class="t-value" x="1120" y="600">~15–40 ns</text>
    <text class="t-value" x="1296" y="600">8–384 MiB</text>

    <rect class="c-memory" x="288" y="648" width="624" height="96" rx="4"/>
    <text class="t-label-strong" x="600" y="704" text-anchor="middle">DRAM (RAM)</text>
    <text class="t-value" x="1120" y="704">~80–100 ns</text>
    <text class="t-value" x="1296" y="704">GBs</text>

    <rect class="c-storage" x="236" y="752" width="728" height="96" rx="4"/>
    <text class="t-label-strong" x="600" y="808" text-anchor="middle">NVMe SSD</text>
    <text class="t-value" x="1120" y="808">~20–100 µs</text>
    <text class="t-value" x="1296" y="808">TBs</text>

    <rect class="c-storage" x="184" y="856" width="832" height="96" rx="4"/>
    <text class="t-label-strong" x="600" y="912" text-anchor="middle">SATA SSD</text>
    <text class="t-value" x="1120" y="912">~100–500 µs</text>
    <text class="t-value" x="1296" y="912">TBs</text>

    <rect class="c-storage" x="132" y="960" width="936" height="96" rx="4"/>
    <text class="t-label-strong" x="600" y="1016" text-anchor="middle">HDD</text>
    <text class="t-value" x="1120" y="1016">~5–10 ms</text>
    <text class="t-value" x="1296" y="1016">TBs</text>

