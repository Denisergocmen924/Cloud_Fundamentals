  <g id="background">
    <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  </g>

  <g id="title">
    <text class="t-title" x="64" y="88">8.4.1 The key that is never shared</text>
    <text class="t-subtitle" x="64" y="132">TLS handshake</text>
    <text class="t-fig" x="1536" y="88" text-anchor="end">Figure 8.1</text>
    <line class="l-rule" x1="64" y1="160" x2="1536" y2="160"/>
  </g>

  <g id="content">
    <text class="t-label-strong" x="400" y="216" text-anchor="middle">Client</text>
    <line class="l-plain" x1="400" y1="232" x2="400" y2="768" stroke-dasharray="4 4"/>
    <text class="t-label-strong" x="1160" y="216" text-anchor="middle">Server</text>
    <line class="l-plain" x1="1160" y1="232" x2="1160" y2="768" stroke-dasharray="4 4"/>

    <line class="l-data" x1="412" y1="300" x2="1148" y2="300" marker-end="url(#arrow-data)"/>
    <text class="t-label-strong" x="780" y="286" text-anchor="middle">1  Client Hello</text>
    <text class="t-note" x="780" y="330" text-anchor="middle">TLS 1.3, cipher list, SNI example.com</text>

    <line class="l-data" x1="1148" y1="400" x2="412" y2="400" marker-end="url(#arrow-data)"/>
    <text class="t-label-strong" x="780" y="386" text-anchor="middle">2  Server Hello</text>
    <text class="t-note" x="780" y="430" text-anchor="middle">chosen cipher + certificate + key share</text>

    <rect class="c-security" x="64" y="456" width="300" height="104" rx="16"/>
    <text class="t-label-strong" x="214" y="498" text-anchor="middle">3  verify the</text>
    <text class="t-label" x="214" y="532" text-anchor="middle">certificate chain</text>

    <rect class="s-boundary" x="520" y="500" width="520" height="128" rx="16"/>
    <text class="t-label-strong" x="780" y="548" text-anchor="middle">4  session key</text>
    <text class="t-note" x="780" y="584" text-anchor="middle">computed on both sides, never sent</text>
    <line class="l-async" x1="412" y1="564" x2="512" y2="564" marker-end="url(#arrow-control)"/>
    <line class="l-async" x1="1148" y1="564" x2="1048" y2="564" marker-end="url(#arrow-control)"/>

    <text class="t-note" x="780" y="652" text-anchor="middle">a listener sees the public values but not the secrets</text>

    <line class="l-data" x1="412" y1="722" x2="1148" y2="722" marker-end="url(#arrow-data)"/>
    <text class="t-label-strong" x="780" y="708" text-anchor="middle">5  Finished</text>
    <text class="t-note" x="780" y="752" text-anchor="middle">everything after this point is encrypted</text>

    <text class="t-note" x="64" y="796">TLS runs on top of TCP: the three-way handshake has already finished before step 1.</text>
  </g>

