    <text class="t-note" x="420" y="464">does the name resolve?</text>
    <text class="t-value" x="880" y="464">dig name</text>
    <text class="t-note" x="1240" y="464">the resolver chain</text>

    <rect class="c-software" x="64" y="512" width="1152" height="80" rx="4"/>
