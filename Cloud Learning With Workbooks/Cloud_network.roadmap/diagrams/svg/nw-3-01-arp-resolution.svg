  <defs>
    <marker id="arrow-data" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L16,8 L0,16 z" fill="#111827"/>
    </marker>
    <marker id="arrow-control" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#111827"/>
    </marker>
    <marker id="arrow-problem" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L16,8 L0,16 z" fill="#DC2626"/>
    </marker>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  </g>

  <g id="title">
    <text class="t-title" x="64" y="88">3.1.2 How ARP works: request broadcast, reply unicast</text>
    <text class="t-subtitle" x="64" y="132">From IP address to MAC address</text>
    <text class="t-fig" x="1536" y="88" text-anchor="end">Figure 3.1</text>
    <line class="l-rule" x1="64" y1="160" x2="1536" y2="160"/>
  </g>

  <g id="content">
    <!-- lifelines -->
    <text class="t-label-strong" x="280" y="212" text-anchor="middle">Host A</text>
    <text class="t-value" x="280" y="242" text-anchor="middle">10.0.1.50</text>
    <line class="l-plain" x1="280" y1="256" x2="280" y2="584" stroke-dasharray="4 4"/>

    <text class="t-label-strong" x="880" y="212" text-anchor="middle">Host B</text>
    <text class="t-value" x="880" y="242" text-anchor="middle">10.0.1.80</text>
    <line class="l-plain" x1="880" y1="256" x2="880" y2="584" stroke-dasharray="4 4"/>

    <text class="t-label-strong" x="1280" y="212" text-anchor="middle">Host C</text>
    <text class="t-note" x="1280" y="242" text-anchor="middle">not the target</text>
    <line class="l-plain" x1="1280" y1="256" x2="1280" y2="584" stroke-dasharray="4 4"/>

    <!-- 1 request -->
    <circle class="c-ink" cx="180" cy="344" r="20"/>
    <text class="t-label-strong" x="180" y="352" text-anchor="middle">1</text>
    <line class="l-data" x1="292" y1="344" x2="1268" y2="344" marker-end="url(#arrow-data)"/>
    <circle class="s-dot" cx="880" cy="344" r="7"/>
    <text class="t-label-strong" x="580" y="322" text-anchor="middle">ARP Request</text>
    <text class="t-note" x="580" y="296" text-anchor="middle">broadcast: every host on the subnet gets it</text>
    <text class="t-value" x="580" y="380" text-anchor="middle">who has 10.0.1.80?  dst ff:ff:ff:ff:ff:ff</text>

    <!-- 2 reply -->
    <circle class="c-ink" cx="980" cy="480" r="20"/>
    <text class="t-label-strong" x="980" y="488" text-anchor="middle">2</text>
    <line class="l-data" x1="868" y1="480" x2="292" y2="480" marker-end="url(#arrow-data)"/>
    <text class="t-label-strong" x="580" y="458" text-anchor="middle">ARP Reply</text>
    <text class="t-value" x="580" y="516" text-anchor="middle">10.0.1.80 is at dd:ee:ff:44:55:66</text>
    <text class="t-note" x="580" y="546" text-anchor="middle">unicast: only A needs the answer</text>

    <!-- 3 cache -->
    <line class="l-control" x1="280" y1="584" x2="280" y2="608" marker-end="url(#arrow-control)"/>
    <circle class="c-ink" cx="120" cy="668" r="20"/>
    <text class="t-label-strong" x="120" y="676" text-anchor="middle">3</text>
    <rect class="c-network" x="160" y="616" width="480" height="104" rx="16"/>
    <text class="t-label-strong" x="184" y="656">ARP cache on A</text>
    <text class="t-value" x="184" y="696">10.0.1.80  dd:ee:ff:44:55:66</text>

    <text class="t-note" x="1280" y="640" text-anchor="middle">Host C reads the IP and drops the frame.</text>
    <text class="t-note" x="1536" y="768" text-anchor="end">Every host that hears the request also learns the mapping of A.</text>

  </g>

  <g id="footer" transform="translate(0,0)">
