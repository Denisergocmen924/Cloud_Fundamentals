    <text class="t-note" x="780" y="236" text-anchor="middle">Routing table</text>

    <rect class="c-network" x="64" y="320" width="236" height="96" rx="4"/>
    <text class="t-value" x="182" y="376" text-anchor="middle">10.0.5.77</text>

    <!-- row 1 -->
    <text class="t-value" x="400" y="312" text-anchor="middle">/8</text>
    <rect class="c-ink" x="480" y="264" width="600" height="80" rx="4"/>
    <text class="t-value" x="504" y="312">10.0.0.0/8    via 192.168.1.1</text>
    <text class="t-note" x="1056" y="312" text-anchor="end">match</text>

    <!-- row 2 : winner -->
    <text class="t-value" x="400" y="416" text-anchor="middle">/24</text>
    <rect class="c-network" x="480" y="368" width="600" height="80" rx="4"/>
    <text class="t-value" x="504" y="416">10.0.5.0/24   via 192.168.1.2</text>
    <text class="t-note" x="1056" y="416" text-anchor="end">longest</text>

    <!-- row 3 -->
    <text class="t-value" x="400" y="520" text-anchor="middle">/0</text>
    <rect class="c-ink" x="480" y="472" width="600" height="80" rx="4"/>
    <text class="t-value" x="504" y="520">0.0.0.0/0     via 192.168.1.254</text>
    <text class="t-note" x="1056" y="520" text-anchor="end">match</text>

    <!-- decision -->
    <line class="l-data" x1="1080" y1="408" x2="1152" y2="408" marker-end="url(#arrow-data)"/>
    <rect class="c-network" x="1160" y="352" width="376" height="136" rx="16"/>
    <text class="t-label-strong" x="1184" y="392">Chosen route</text>
    <text class="t-value" x="1184" y="428">via 192.168.1.2</text>
    <text class="t-value" x="1184" y="464">dev ens5</text>

    <text class="t-note" x="480" y="592">All three rows match the destination. The longest prefix wins.</text>
    <text class="t-note" x="480" y="624">0.0.0.0/0 has prefix length 0, so it is always the last choice.</text>

