    <text class="t-subtitle" x="64" y="132">DHCP address handover</text>
    <text class="t-fig" x="1536" y="88" text-anchor="end">Figure 1.1</text>
    <line class="l-rule" x1="64" y1="160" x2="1536" y2="160"/>
  </g>

  <g id="content">
    <!-- lifelines -->
    <text class="t-label-strong" x="360" y="216" text-anchor="middle">Client</text>
    <line class="l-plain" x1="360" y1="232" x2="360" y2="632" stroke-dasharray="4 4"/>
    <text class="t-label-strong" x="1000" y="216" text-anchor="middle">DHCP server</text>
    <line class="l-plain" x1="1000" y1="232" x2="1000" y2="632" stroke-dasharray="4 4"/>

    <!-- 1 Discover -->
    <circle class="c-ink" cx="312" cy="288" r="20"/>
    <text class="t-label-strong" x="312" y="296" text-anchor="middle">1</text>
    <line class="l-data" x1="372" y1="288" x2="988" y2="288" marker-end="url(#arrow-data)"/>
    <text class="t-label-strong" x="680" y="274" text-anchor="middle">Discover</text>
    <text class="t-note" x="680" y="318" text-anchor="middle">broadcast</text>
    <text class="t-value" x="680" y="348" text-anchor="middle">src 0.0.0.0  dst 255.255.255.255</text>

    <!-- 2 Offer -->
    <circle class="c-ink" cx="1048" cy="392" r="20"/>
    <text class="t-label-strong" x="1048" y="400" text-anchor="middle">2</text>
    <line class="l-data" x1="988" y1="392" x2="372" y2="392" marker-end="url(#arrow-data)"/>
    <text class="t-label-strong" x="680" y="378" text-anchor="middle">Offer</text>
    <text class="t-note" x="680" y="422" text-anchor="middle">unicast</text>
    <text class="t-value" x="680" y="452" text-anchor="middle">10.0.1.47  lease 24 h</text>

    <!-- 3 Request -->
    <circle class="c-ink" cx="312" cy="496" r="20"/>
    <text class="t-label-strong" x="312" y="504" text-anchor="middle">3</text>
    <line class="l-data" x1="372" y1="496" x2="988" y2="496" marker-end="url(#arrow-data)"/>
    <text class="t-label-strong" x="680" y="482" text-anchor="middle">Request</text>
    <text class="t-note" x="680" y="526" text-anchor="middle">broadcast</text>

    <!-- 4 Ack -->
    <circle class="c-ink" cx="1048" cy="584" r="20"/>
    <text class="t-label-strong" x="1048" y="592" text-anchor="middle">4</text>
    <line class="l-data" x1="988" y1="584" x2="372" y2="584" marker-end="url(#arrow-data)"/>
    <text class="t-label-strong" x="680" y="570" text-anchor="middle">Ack</text>
    <text class="t-note" x="680" y="614" text-anchor="middle">unicast</text>

    <!-- result box -->
    <rect class="c-network" x="1080" y="640" width="456" height="136" rx="16"/>
    <text class="t-label-strong" x="1104" y="676">Ack delivers four things</text>
    <text class="t-value" x="1104" y="716">IP address</text>
    <text class="t-value" x="1104" y="750">subnet mask</text>
    <text class="t-value" x="1320" y="716">gateway</text>
    <text class="t-value" x="1320" y="750">DNS server</text>

    <text class="t-note" x="64" y="700">Time flows from top to bottom. Step 1 has no address yet.</text>

