    <text class="t-title" x="64" y="88">5.2.1 SYN, SYN-ACK, ACK</text>
    <text class="t-subtitle" x="64" y="132">The three-way handshake</text>
    <text class="t-fig" x="1536" y="88" text-anchor="end">Figure 5.1</text>
