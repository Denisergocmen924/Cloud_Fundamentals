  </g>

  <g id="content">
    <text class="t-label-strong" x="420" y="216" text-anchor="middle">Client</text>
    <line class="l-plain" x1="420" y1="232" x2="420" y2="748" stroke-dasharray="4 4"/>
    <text class="t-label-strong" x="1000" y="216" text-anchor="middle">Server</text>
    <line class="l-plain" x1="1000" y1="232" x2="1000" y2="748" stroke-dasharray="4 4"/>

    <!-- 1 SYN -->
    <circle class="c-ink" cx="352" cy="304" r="20"/>
    <text class="t-label-strong" x="352" y="312" text-anchor="middle">1</text>
    <line class="l-data" x1="432" y1="304" x2="988" y2="304" marker-end="url(#arrow-data)"/>
    <text class="t-label-strong" x="710" y="290" text-anchor="middle">SYN</text>
    <text class="t-value" x="710" y="334" text-anchor="middle">seq=1000</text>
    <rect class="c-network" x="64" y="352" width="272" height="56" rx="16"/>
    <text class="t-value" x="200" y="388" text-anchor="middle">SYN-SENT</text>
    <rect class="c-network" x="1080" y="352" width="272" height="56" rx="16"/>
    <text class="t-value" x="1216" y="388" text-anchor="middle">SYN-RECV</text>

    <!-- 2 SYN-ACK -->
    <circle class="c-ink" cx="1068" cy="448" r="20"/>
    <text class="t-label-strong" x="1068" y="456" text-anchor="middle">2</text>
    <line class="l-data" x1="988" y1="448" x2="432" y2="448" marker-end="url(#arrow-data)"/>
    <text class="t-label-strong" x="710" y="434" text-anchor="middle">SYN-ACK</text>
    <text class="t-value" x="710" y="478" text-anchor="middle">seq=5000  ack=1001</text>

    <!-- 3 ACK -->
    <circle class="c-ink" cx="352" cy="560" r="20"/>
    <text class="t-label-strong" x="352" y="568" text-anchor="middle">3</text>
    <line class="l-data" x1="432" y1="560" x2="988" y2="560" marker-end="url(#arrow-data)"/>
    <text class="t-label-strong" x="710" y="546" text-anchor="middle">ACK</text>
    <text class="t-value" x="710" y="590" text-anchor="middle">ack=5001</text>

    <rect class="c-network" x="64" y="616" width="272" height="56" rx="16"/>
    <text class="t-value" x="200" y="652" text-anchor="middle">ESTABLISHED</text>
    <rect class="c-network" x="1080" y="616" width="272" height="56" rx="16"/>
    <text class="t-value" x="1216" y="652" text-anchor="middle">ESTABLISHED</text>

    <line class="l-data" x1="432" y1="720" x2="988" y2="720" marker-start="url(#arrow-data)" marker-end="url(#arrow-data)"/>
    <text class="t-note" x="710" y="706" text-anchor="middle">data can flow in both directions</text>

    <text class="t-note" x="64" y="790">Time flows from top to bottom. The start numbers are random.</text>

