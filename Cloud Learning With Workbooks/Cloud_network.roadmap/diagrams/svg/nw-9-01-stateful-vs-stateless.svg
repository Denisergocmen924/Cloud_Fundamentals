  <g id="content">
    <rect class="s-boundary" x="64" y="200" width="720" height="520" rx="16"/>
    <rect class="s-boundary" x="816" y="200" width="720" height="520" rx="16"/>

    <text class="t-label-strong" x="424" y="252" text-anchor="middle">Stateful</text>
    <text class="t-note" x="424" y="286" text-anchor="middle">cloud: security group</text>
    <text class="t-label-strong" x="1176" y="252" text-anchor="middle">Stateless</text>
    <text class="t-note" x="1176" y="286" text-anchor="middle">cloud: NACL</text>

    <rect class="c-compute" x="96" y="320" width="180" height="80" rx="4"/>
    <text class="t-label" x="186" y="352" text-anchor="middle">host</text>
    <text class="t-value" x="186" y="384" text-anchor="middle">10.0.1.50</text>
    <rect class="c-software" x="568" y="320" width="188" height="80" rx="4"/>
    <text class="t-label" x="662" y="368" text-anchor="middle">internet</text>
    <line class="l-data" x1="284" y1="368" x2="560" y2="368" marker-end="url(#arrow-data)"/>
    <text class="t-note" x="422" y="346" text-anchor="middle">rule: allow out</text>

    <rect class="c-io" x="96" y="432" width="660" height="96" rx="4"/>
    <text class="t-note" x="426" y="468" text-anchor="middle">connection table</text>
    <text class="t-value" x="426" y="504" text-anchor="middle">10.0.1.50:51234 -&gt; 93.184.216.34:443</text>

    <line class="l-data" x1="560" y1="584" x2="284" y2="584" marker-end="url(#arrow-data)"/>
    <text class="t-label-strong" x="422" y="570" text-anchor="middle">reply</text>
    <text class="t-note" x="422" y="614" text-anchor="middle">matches the row, passes with no extra rule</text>
    <text class="t-note" x="96" y="684">you write only the direction that starts the connection</text>

    <rect class="c-compute" x="848" y="320" width="180" height="80" rx="4"/>
    <text class="t-label" x="938" y="352" text-anchor="middle">host</text>
    <text class="t-value" x="938" y="384" text-anchor="middle">10.0.1.50</text>
    <rect class="c-software" x="1320" y="320" width="188" height="80" rx="4"/>
    <text class="t-label" x="1414" y="368" text-anchor="middle">internet</text>
    <line class="l-data" x1="1036" y1="368" x2="1312" y2="368" marker-end="url(#arrow-data)"/>
    <text class="t-note" x="1174" y="346" text-anchor="middle">rule 1: allow out</text>

    <rect class="c-software" x="848" y="432" width="660" height="96" rx="4"/>
    <text class="t-note" x="1178" y="468" text-anchor="middle">no table: each packet is judged on its own</text>
    <text class="t-label" x="1178" y="504" text-anchor="middle">rule 2 must allow the return</text>

    <line class="l-data" x1="1312" y1="584" x2="1036" y2="584" marker-end="url(#arrow-data)"/>
    <text class="t-label-strong" x="1174" y="570" text-anchor="middle">reply</text>
    <text class="t-note" x="1174" y="614" text-anchor="middle">blocked unless rule 2 exists</text>
    <text class="t-note" x="848" y="684">you write both directions, every time</text>

    <text class="t-note" x="64" y="780">Same traffic, two models. The table is what removes the need for the second rule.</text>
  </g>

