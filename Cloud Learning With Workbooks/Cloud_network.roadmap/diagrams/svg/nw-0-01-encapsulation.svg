<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">

  <style>
    text { font-family: "Noto Sans", "DejaVu Sans", sans-serif; fill: #111827; }
    .t-title        { font-size: 40px; font-weight: 700; }
    .t-subtitle     { font-size: 26px; font-weight: 400; fill: #4B5563; }
    .t-fig          { font-size: 24px; font-weight: 600; fill: #4B5563; }
    .t-label        { font-size: 24px; font-weight: 400; }
    .t-label-strong { font-size: 24px; font-weight: 600; }
    .t-value        { font-size: 22px; font-weight: 400; font-family: "Noto Sans Mono", "DejaVu Sans Mono", monospace; }
    .t-note         { font-size: 20px; font-weight: 400; fill: #4B5563; }
    .t-sign         { font-size: 20px; font-weight: 400; fill: #6B7280; }
    .c-network  { fill: #EDE9FE; stroke: #6D28D9; stroke-width: 2; }
    .c-software { fill: #F3F4F6; stroke: #374151; stroke-width: 2; }
    .l-data    { fill: none; stroke: #111827; stroke-width: 4; }
    .l-plain   { fill: none; stroke: #374151; stroke-width: 2; }
    .l-rule    { fill: none; stroke: #E5E7EB; stroke-width: 2; }
  </style>

  <defs>
    <marker id="arrow-data" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L16,8 L0,16 z" fill="#111827"/>
    </marker>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  </g>

  <g id="title">
    <text class="t-title" x="64" y="88">0.2.1 Wrapping: each layer adds an envelope</text>
    <text class="t-subtitle" x="64" y="132">Encapsulation of one HTTP request</text>
    <text class="t-fig" x="1536" y="88" text-anchor="end">Figure 0.1</text>
    <line class="l-rule" x1="64" y1="160" x2="1536" y2="160"/>
  </g>

  <g id="content">
    <text class="t-note" x="64" y="204">Each layer adds its own header. The data inside never changes.</text>

    <!-- row 1: L7 -->
    <text class="t-label-strong" x="64" y="296">L7 Application</text>
    <rect class="c-software" x="728" y="256" width="264" height="64" rx="16"/>
    <text class="t-value" x="860" y="296" text-anchor="middle">HTTP data</text>
    <text class="t-label" x="1264" y="296" text-anchor="end">Data</text>
    <line class="l-rule" x1="64" y1="352" x2="1264" y2="352"/>

    <!-- row 2: L4 -->
    <text class="t-label-strong" x="64" y="424">L4 Transport</text>
    <rect class="c-network" x="624" y="384" width="104" height="64" rx="4"/>
    <text class="t-value" x="676" y="424" text-anchor="middle">TCP</text>
    <rect class="c-software" x="728" y="384" width="264" height="64" rx="16"/>
    <text class="t-value" x="860" y="424" text-anchor="middle">data</text>
    <text class="t-label" x="1264" y="424" text-anchor="end">Segment</text>
    <line class="l-rule" x1="64" y1="480" x2="1264" y2="480"/>

    <!-- row 3: L3 -->
    <text class="t-label-strong" x="64" y="552">L3 Network</text>
    <rect class="c-network" x="520" y="512" width="104" height="64" rx="4"/>
    <text class="t-value" x="572" y="552" text-anchor="middle">IP</text>
    <rect class="c-network" x="624" y="512" width="104" height="64" rx="4"/>
    <text class="t-value" x="676" y="552" text-anchor="middle">TCP</text>
    <rect class="c-software" x="728" y="512" width="264" height="64" rx="16"/>
    <text class="t-value" x="860" y="552" text-anchor="middle">data</text>
    <text class="t-label" x="1264" y="552" text-anchor="end">Packet</text>
    <line class="l-rule" x1="64" y1="608" x2="1264" y2="608"/>

    <!-- row 4: L2 -->
    <text class="t-label-strong" x="64" y="680">L2 Data link</text>
    <rect class="c-network" x="416" y="640" width="104" height="64" rx="4"/>
    <text class="t-value" x="468" y="680" text-anchor="middle">Eth</text>
    <rect class="c-network" x="520" y="640" width="104" height="64" rx="4"/>
    <text class="t-value" x="572" y="680" text-anchor="middle">IP</text>
    <rect class="c-network" x="624" y="640" width="104" height="64" rx="4"/>
    <text class="t-value" x="676" y="680" text-anchor="middle">TCP</text>
    <rect class="c-software" x="728" y="640" width="264" height="64" rx="16"/>
    <text class="t-value" x="860" y="680" text-anchor="middle">data</text>
    <rect class="c-network" x="992" y="640" width="88" height="64" rx="4"/>
    <text class="t-value" x="1036" y="680" text-anchor="middle">FCS</text>
    <text class="t-label" x="1264" y="680" text-anchor="end">Frame</text>

    <!-- send direction -->
    <line class="l-data" x1="1440" y1="248" x2="1440" y2="712" marker-end="url(#arrow-data)"/>
    <text class="t-label-strong" x="1416" y="464" text-anchor="end">Host A</text>
    <text class="t-note" x="1416" y="492" text-anchor="end">adds headers</text>

    <text class="t-note" x="64" y="768">Host B removes the same headers in reverse order.</text>
  </g>

  <g id="footer">
    <line class="l-rule" x1="64" y1="836" x2="1536" y2="836"/>
    <text class="t-sign" x="64" y="876" xml:space="preserve">Created by Denis Ergöçmen    GitHub: https://github.com/Denisergocmen924</text>
  </g>

</svg>
