<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">

  <style>
    /* ---------- Text (§7) ---------- */
    text { font-family: "Noto Sans", "DejaVu Sans", sans-serif; fill: #111827; }
    .t-title        { font-size: 40px; font-weight: 700; }
    .t-subtitle     { font-size: 26px; font-weight: 400; fill: #4B5563; }
    .t-fig          { font-size: 24px; font-weight: 600; fill: #4B5563; }
    .t-label        { font-size: 24px; font-weight: 400; }
    .t-label-strong { font-size: 24px; font-weight: 600; }
    .t-value        { font-size: 22px; font-weight: 400; font-family: "Noto Sans Mono", "DejaVu Sans Mono", monospace; }
    .t-note         { font-size: 20px; font-weight: 400; fill: #4B5563; }
    .t-sign         { font-size: 20px; font-weight: 400; fill: #6B7280; }
    .t-problem      { fill: #DC2626; }

    /* ---------- Domain colors (§8.2) — same meaning in every subject ---------- */
    .c-compute  { fill: #DBEAFE; stroke: #1D4ED8; stroke-width: 2; }
    .c-memory   { fill: #DCFCE7; stroke: #15803D; stroke-width: 2; }
    .c-storage  { fill: #FFEDD5; stroke: #C2410C; stroke-width: 2; }
    .c-io       { fill: #FEF9C3; stroke: #A16207; stroke-width: 2; }
    .c-network  { fill: #EDE9FE; stroke: #6D28D9; stroke-width: 2; }
    .c-virt     { fill: #CCFBF1; stroke: #0F766E; stroke-width: 2; }
    .c-security { fill: #FCE7F3; stroke: #9D174D; stroke-width: 2; }
    .c-software { fill: #F3F4F6; stroke: #374151; stroke-width: 2; }
    .c-ink      { fill: #FFFFFF; stroke: #111827; stroke-width: 2; }
    .c-problem  { fill: #FEE2E2; stroke: #DC2626; stroke-width: 2; }

    /* ---------- Shapes (§9) ---------- */
    .s-boundary { fill: none; stroke: #6B7280; stroke-width: 2; stroke-dasharray: 8 6; }
    .s-unit     { fill: #374151; stroke: none; }
    .s-dot      { fill: #111827; stroke: none; }

    /* ---------- Lines (§10) ---------- */
    .l-data    { fill: none; stroke: #111827; stroke-width: 4; }
    .l-control { fill: none; stroke: #111827; stroke-width: 2; }
    .l-async   { fill: none; stroke: #111827; stroke-width: 2; stroke-dasharray: 6 4; }
    .l-problem { fill: none; stroke: #DC2626; stroke-width: 4; }
    .l-plain   { fill: none; stroke: #374151; stroke-width: 2; }
    .l-rule    { fill: none; stroke: #E5E7EB; stroke-width: 2; }
    .l-guide   { fill: none; stroke: #E5E7EB; stroke-width: 2; }
  </style>

  <defs>
    <marker id="arrow-data" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L16,8 L0,16 z" fill="#111827"/>
    </marker>
    <marker id="arrow-control" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#111827"/>
    </marker>
    <marker id="arrow-problem" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L16,8 L0,16 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- ===== background ===== -->
  <g id="background">
    <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  </g>

  <!-- ===== title (§5.1) ===== -->
  <g id="title">
    <text class="t-title" x="64" y="88">2.5.1 The SSH key journey on EC2</text>
    <text class="t-subtitle" x="64" y="132">From a key pair in the console to a verified login</text>
    <text class="t-fig" x="1536" y="88" text-anchor="end">Figure 2.3</text>
    <line class="l-rule" x1="64" y1="160" x2="1536" y2="160"/>
  </g>

  <!-- ===== content (§4: x 64–1536, y 184–812) ===== -->
  <g id="content">
    <!-- Four stages left to right; the key travels along the top, details sit below each stage. -->

    <!-- stage boxes -->
    <rect class="c-software" x="100" y="216" width="296" height="96" rx="16"/>
    <circle class="c-ink" cx="140" cy="264" r="20"/>
    <text class="t-label-strong" x="140" y="272" text-anchor="middle">1</text>
    <text class="t-label-strong" x="176" y="272">AWS Console</text>

    <rect class="c-software" x="480" y="216" width="296" height="96" rx="16"/>
    <circle class="c-ink" cx="520" cy="264" r="20"/>
    <text class="t-label-strong" x="520" y="272" text-anchor="middle">2</text>
    <text class="t-label-strong" x="556" y="272">IMDS</text>

    <rect class="c-software" x="860" y="216" width="296" height="96" rx="16"/>
    <circle class="c-ink" cx="900" cy="264" r="20"/>
    <text class="t-label-strong" x="900" y="272" text-anchor="middle">3</text>
    <text class="t-label-strong" x="936" y="272">cloud-init</text>

    <rect class="c-software" x="1240" y="216" width="296" height="96" rx="16"/>
    <circle class="c-ink" cx="1280" cy="264" r="20"/>
    <text class="t-label-strong" x="1280" y="272" text-anchor="middle">4</text>
    <text class="t-label-strong" x="1316" y="272">sshd</text>

    <!-- flow arrows -->
    <line class="l-data" x1="396" y1="264" x2="478" y2="264" marker-end="url(#arrow-data)"/>
    <line class="l-data" x1="776" y1="264" x2="858" y2="264" marker-end="url(#arrow-data)"/>
    <line class="l-data" x1="1156" y1="264" x2="1238" y2="264" marker-end="url(#arrow-data)"/>

    <!-- step to detail -->
    <line class="l-control" x1="248" y1="312" x2="248" y2="370" marker-end="url(#arrow-control)"/>
    <line class="l-control" x1="628" y1="312" x2="628" y2="370" marker-end="url(#arrow-control)"/>
    <line class="l-control" x1="1008" y1="312" x2="1008" y2="370" marker-end="url(#arrow-control)"/>
    <line class="l-control" x1="1388" y1="312" x2="1388" y2="370" marker-end="url(#arrow-control)"/>

    <!-- detail boxes -->
    <rect class="c-security" x="100" y="372" width="296" height="332" rx="16"/>
    <text class="t-label-strong" x="124" y="420">key pair created</text>
    <text class="t-note" x="124" y="464">public key</text>
    <text class="t-note" x="124" y="494">→ stored in AWS</text>
    <text class="t-note" x="124" y="544">private .pem</text>
    <text class="t-note" x="124" y="574">→ you download once</text>
    <text class="t-note" x="124" y="636">AWS never keeps</text>
    <text class="t-note" x="124" y="666">the private key</text>

    <rect class="c-network" x="480" y="372" width="296" height="332" rx="16"/>
    <text class="t-label-strong" x="504" y="420">public key appears</text>
    <text class="t-value" x="504" y="470">169.254.169.254</text>
    <text class="t-note" x="504" y="516">/latest/meta-data/</text>
    <text class="t-note" x="504" y="546">public-keys/0/</text>
    <text class="t-note" x="504" y="576">openssh-key</text>
    <text class="t-note" x="504" y="636">link-local, on the</text>
    <text class="t-note" x="504" y="666">instance only</text>

    <rect class="c-storage" x="860" y="372" width="296" height="332" rx="16"/>
    <text class="t-label-strong" x="884" y="420">first boot only</text>
    <text class="t-note" x="884" y="464">creates user</text>
    <text class="t-note" x="884" y="494">(ubuntu) + sudo</text>
    <text class="t-note" x="884" y="544">writes key to</text>
    <text class="t-value" x="884" y="576">authorized_keys</text>
    <text class="t-note" x="884" y="636">.ssh 700</text>
    <text class="t-note" x="884" y="666">keys 600</text>

    <rect class="c-compute" x="1240" y="372" width="296" height="332" rx="16"/>
    <text class="t-label-strong" x="1264" y="420">every login</text>
    <text class="t-note" x="1264" y="464">StrictModes checks</text>
    <text class="t-note" x="1264" y="494">ownership + modes</text>
    <text class="t-note" x="1264" y="544">verifies your</text>
    <text class="t-note" x="1264" y="574">signed challenge</text>
    <text class="t-note" x="1264" y="636">no password</text>
    <text class="t-note" x="1264" y="666">is ever used</text>

    <text class="t-note" x="800" y="784" text-anchor="middle">The console key pair is read only at first boot — changing it later does not touch a running instance's authorized_keys.</text>
  </g>

  <!-- ===== footer (§5.2) — do not change ===== -->
  <g id="footer">
    <line class="l-rule" x1="64" y1="836" x2="1536" y2="836"/>
    <text class="t-sign" x="64" y="876" xml:space="preserve">Created by Denis Ergöçmen    GitHub: https://github.com/Denisergocmen924</text>
  </g>

</svg>
