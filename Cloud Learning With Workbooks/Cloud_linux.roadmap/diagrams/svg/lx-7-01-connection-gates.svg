<?xml version="1.0" encoding="UTF-8"?>
<!--
  ============================================================
  DIAGRAM HEADER
  ============================================================
  file:             lx-7-01-connection-gates
  subject:          Linux
  figure:           7.1
  section:          7.4 Connection gates — the path a request must pass
  subtitle:         A service can be up and still be unreachable — every gate must be open
  type:             Flow
  source:           Cloud Learning With Workbooks/Cloud_linux.roadmap/English_Linux/Phase_7_Networking_and_Connectivity.md
  boundary:         sections 7.2, 7.4, 7.5 — the reachability chain, outside to in
  height:           900
  number-conflicts: none
  scale:            not to scale (sequence of gates, not time)
  ============================================================

  Rules: diagram_example/Standart_Rules_Diagrams.md
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">

  <style>
    /* ---------- Text (§7) ---------- */
    text { font-family: "Noto Sans", "DejaVu Sans", sans-serif; fill: #111827; }
    .t-title        { font-size: 40px; font-weight: 700; }
    .t-subtitle     { font-size: 26px; font-weight: 400; fill: #4B5563; }
    .t-fig          { font-size: 24px; font-weight: 600; fill: #4B5563; }
    .t-box          { font-size: 26px; font-weight: 700; }
    .t-role         { font-size: 20px; font-weight: 400; fill: #4B5563; }
    .t-label        { font-size: 24px; font-weight: 400; }
    .t-label-strong { font-size: 24px; font-weight: 600; }
    .t-verb         { font-size: 20px; font-weight: 700; fill: #15803D; }
    .t-note         { font-size: 20px; font-weight: 400; fill: #4B5563; }
    .t-sign         { font-size: 20px; font-weight: 400; fill: #6B7280; }
    .t-danger       { fill: #B91C1C; font-weight: 700; }
    .t-mono         { font-family: "DejaVu Sans Mono", monospace; font-size: 19px; fill: #374151; }

    /* ---------- Domain colors (§8.2) ---------- */
    .c-compute  { fill: #DBEAFE; stroke: #1D4ED8; stroke-width: 2; }
    .c-memory   { fill: #DCFCE7; stroke: #15803D; stroke-width: 2; }
    .c-software { fill: #F3F4F6; stroke: #374151; stroke-width: 2; }
    .c-problem  { fill: #FEE2E2; stroke: #B91C1C; stroke-width: 2; }

    /* ---------- Shapes (§9) ---------- */
    .s-boundary { fill: none; stroke: #6B7280; stroke-width: 2; stroke-dasharray: 8 6; }

    /* ---------- Lines (§10) ---------- */
    .l-data    { fill: none; stroke: #111827; stroke-width: 4; }
    .l-pass    { fill: none; stroke: #15803D; stroke-width: 4; }
    .l-rule    { fill: none; stroke: #E5E7EB; stroke-width: 2; }
  </style>

  <defs>
    <marker id="arrow-data" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L16,8 L0,16 z" fill="#111827"/>
    </marker>
    <marker id="arrow-pass" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L16,8 L0,16 z" fill="#15803D"/>
    </marker>
  </defs>

  <!-- ===== background ===== -->
  <g id="background">
    <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  </g>

  <!-- ===== title (§5.1) ===== -->
  <g id="title">
    <text class="t-title" x="64" y="88">7.4 Connection gates — the path a request must pass</text>
    <text class="t-subtitle" x="64" y="132">A service can be up and still be unreachable — every gate must be open</text>
    <text class="t-fig" x="1536" y="88" text-anchor="end">Figure 7.1</text>
    <line class="l-rule" x1="64" y1="160" x2="1536" y2="160"/>
  </g>

  <!-- ===== content (§4: x 64–1536, y 184–812) ===== -->
  <g id="content">

    <text class="t-label-strong" x="64" y="214">A connection request travels outside → in. Every gate must be open, or it fails.</text>

    <!-- ===================== gate row ===================== -->
    <!-- 5 boxes, width 240, gap 68; y 244, height 156; centers 184/492/800/1108/1416 -->

    <!-- 1 DNS -->
    <rect class="c-software" x="64" y="244" width="240" height="156" rx="8"/>
    <text class="t-box"  x="184" y="292" text-anchor="middle">① DNS</text>
    <text class="t-role" x="184" y="324" text-anchor="middle">name → IP</text>
    <text class="t-mono" x="184" y="372" text-anchor="middle">resolv.conf</text>

    <!-- 2 Security Group -->
    <rect class="c-compute" x="372" y="244" width="240" height="156" rx="8"/>
    <text class="t-box"  x="492" y="292" text-anchor="middle">② Security</text>
    <text class="t-box"  x="492" y="322" text-anchor="middle">Group</text>
    <text class="t-role" x="492" y="352" text-anchor="middle">cloud layer</text>
    <text class="t-mono" x="492" y="386" text-anchor="middle">cloud console</text>

    <!-- 3 host firewall -->
    <rect class="c-software" x="680" y="244" width="240" height="156" rx="8"/>
    <text class="t-box"  x="800" y="292" text-anchor="middle">③ Host</text>
    <text class="t-box"  x="800" y="322" text-anchor="middle">firewall</text>
    <text class="t-role" x="800" y="352" text-anchor="middle">on the machine</text>
    <text class="t-mono" x="800" y="386" text-anchor="middle">ufw status</text>

    <!-- 4 bind address -->
    <rect class="c-software" x="988" y="244" width="240" height="156" rx="8"/>
    <text class="t-box"  x="1108" y="292" text-anchor="middle">④ Bind</text>
    <text class="t-box"  x="1108" y="322" text-anchor="middle">address</text>
    <text class="t-role" x="1108" y="352" text-anchor="middle">0.0.0.0 vs 127.0.0.1</text>
    <text class="t-mono" x="1108" y="386" text-anchor="middle">ss -tulpn</text>

    <!-- 5 process -->
    <rect class="c-software" x="1296" y="244" width="240" height="156" rx="8"/>
    <text class="t-box"  x="1416" y="292" text-anchor="middle">⑤ Process</text>
    <text class="t-role" x="1416" y="324" text-anchor="middle">service up</text>
    <text class="t-mono" x="1416" y="372" text-anchor="middle">systemctl status</text>

    <!-- pass arrows between gates (y 322) -->
    <line class="l-pass" x1="306" y1="322" x2="370" y2="322" marker-end="url(#arrow-pass)"/>
    <text class="t-verb" x="338" y="234" text-anchor="middle">pass</text>
    <line class="l-pass" x1="614" y1="322" x2="678" y2="322" marker-end="url(#arrow-pass)"/>
    <text class="t-verb" x="646" y="234" text-anchor="middle">pass</text>
    <line class="l-pass" x1="922" y1="322" x2="986" y2="322" marker-end="url(#arrow-pass)"/>
    <text class="t-verb" x="954" y="234" text-anchor="middle">pass</text>
    <line class="l-pass" x1="1230" y1="322" x2="1294" y2="322" marker-end="url(#arrow-pass)"/>
    <text class="t-verb" x="1262" y="234" text-anchor="middle">pass</text>

    <!-- reachable endpoint: down from gate 5 -->
    <line class="l-pass" x1="1416" y1="400" x2="1416" y2="452" marker-end="url(#arrow-pass)"/>
    <rect class="c-memory" x="1296" y="452" width="240" height="72" rx="8"/>
    <text class="t-box" x="1416" y="497" text-anchor="middle">✓ Reachable</text>

    <!-- cloud vs host boundary note -->
    <rect class="s-boundary" x="372" y="420" width="240" height="60" rx="8"/>
    <text class="t-note" x="492" y="457" text-anchor="middle">invisible to the OS</text>

    <!-- ===================== danger callout ===================== -->
    <rect class="c-problem" x="64" y="556" width="1160" height="216" rx="8"/>
    <text class="t-label-strong t-danger" x="644" y="596" text-anchor="middle">Any closed gate breaks the connection — often silently.</text>
    <text class="t-note" x="88" y="636">① name won't resolve → ping the IP works, the name doesn't (7.2)</text>
    <text class="t-note" x="88" y="668">② SG blocks the port → the request just times out; the host looks fine (7.5)</text>
    <text class="t-note" x="88" y="700">③ ufw blocks the port · ④ bound to 127.0.0.1 → only local works (7.4–7.5)</text>
    <text class="t-note" x="88" y="732">⑤ process down → nothing is listening at all (Phase 5)</text>
    <text class="t-label-strong t-danger" x="644" y="764" text-anchor="middle">"systemctl is green" only clears gate ⑤.</text>

    <!-- golden rule box -->
    <rect class="c-memory" x="1256" y="556" width="280" height="216" rx="8"/>
    <text class="t-label-strong" x="1396" y="606" text-anchor="middle">Golden rule</text>
    <text class="t-note" x="1396" y="650" text-anchor="middle">Diagnose</text>
    <text class="t-box" x="1396" y="686" text-anchor="middle">outside → in</text>
    <text class="t-note" x="1396" y="726" text-anchor="middle">one gate at a time,</text>
    <text class="t-note" x="1396" y="752" text-anchor="middle">in this order.</text>

  </g>

  <!-- ===== footer (§5.2) — do not change ===== -->
  <g id="footer">
    <line class="l-rule" x1="64" y1="836" x2="1536" y2="836"/>
    <text class="t-sign" x="64" y="876" xml:space="preserve">Created by Denis Ergöçmen    GitHub: https://github.com/Denisergocmen924</text>
  </g>

</svg>
