    </marker>
  </defs>

  <!-- ===== background ===== -->
  <g id="background">
    <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  </g>

  <!-- ===== title (§5.1) ===== -->
  <g id="title">
    <text class="t-title" x="64" y="88">0.2.2 Syscall — the only door between two worlds</text>
    <text class="t-subtitle" x="64" y="132">The journey of a write() call</text>
    <text class="t-fig" x="1536" y="88" text-anchor="end">Figure 0.2</text>
    <line class="l-rule" x1="64" y1="160" x2="1536" y2="160"/>
  </g>

  <!-- ===== content (§4: x 64–1536, y 184–812) ===== -->
  <g id="content">
    <!-- Two boundaries: user space on top, kernel space below. Four columns (x 112, 472, 832, 1192; width 288).
         Path: program → C library → down into the kernel → check → work → up to the program. -->

    <!-- ===== user space ===== -->
    <rect class="s-boundary" x="64" y="192" width="1472" height="248" rx="4"/>
    <text class="t-label-strong" x="88" y="228">User space · restricted mode</text>

    <rect class="c-software" x="112" y="296" width="288" height="112" rx="16"/>
    <text class="t-label-strong" x="256" y="344" text-anchor="middle">Program</text>
    <text class="t-note" x="256" y="380" text-anchor="middle">calls write()</text>

    <rect class="c-software" x="472" y="296" width="288" height="112" rx="16"/>
    <text class="t-label-strong" x="616" y="344" text-anchor="middle">C library</text>
    <text class="t-note" x="616" y="380" text-anchor="middle">puts args in registers</text>

    <rect class="c-software" x="1192" y="296" width="288" height="112" rx="16"/>
    <text class="t-label-strong" x="1336" y="344" text-anchor="middle">Program continues</text>
    <text class="t-note" x="1336" y="380" text-anchor="middle">write() returns 6</text>

    <!-- ===== mode switch gap ===== -->
    <text class="t-note" x="112" y="476">mode switch</text>

    <!-- ===== kernel space ===== -->
    <rect class="s-boundary" x="64" y="496" width="1472" height="272" rx="4"/>
    <text class="t-label-strong" x="88" y="532">Kernel space · privileged mode</text>

    <rect class="c-software" x="472" y="584" width="288" height="112" rx="16"/>
    <text class="t-label-strong" x="616" y="632" text-anchor="middle">Fixed entry point</text>
    <text class="t-note" x="616" y="668" text-anchor="middle">the only way in</text>

    <rect class="c-software" x="832" y="584" width="288" height="112" rx="16"/>
    <text class="t-label-strong" x="976" y="632" text-anchor="middle">Check request</text>
    <text class="t-note" x="976" y="668" text-anchor="middle">fd, permission, buffer</text>

    <rect class="c-software" x="1192" y="584" width="288" height="112" rx="16"/>
    <text class="t-label-strong" x="1336" y="632" text-anchor="middle">Do the work</text>
    <text class="t-note" x="1336" y="668" text-anchor="middle">6 bytes to driver</text>

    <!-- ===== path ===== -->
    <!-- 1: program calls the library -->
    <line class="l-data" x1="400" y1="352" x2="470" y2="352" marker-end="url(#arrow-data)"/>
    <circle class="c-ink" cx="436" cy="312" r="20"/>
    <text class="t-label-strong" x="436" y="320" text-anchor="middle">1</text>

    <!-- 2: syscall instruction crosses into the kernel -->
    <line class="l-data" x1="616" y1="408" x2="616" y2="582" marker-end="url(#arrow-data)"/>
    <text class="t-label" x="632" y="476">syscall instruction</text>
    <circle class="c-ink" cx="576" cy="468" r="20"/>
    <text class="t-label-strong" x="576" y="476" text-anchor="middle">2</text>

    <!-- 3: entry point to checks -->
    <line class="l-data" x1="760" y1="640" x2="830" y2="640" marker-end="url(#arrow-data)"/>
    <circle class="c-ink" cx="796" cy="600" r="20"/>
    <text class="t-label-strong" x="796" y="608" text-anchor="middle">3</text>

    <!-- 4: checks to work -->
    <line class="l-data" x1="1120" y1="640" x2="1190" y2="640" marker-end="url(#arrow-data)"/>
    <circle class="c-ink" cx="1156" cy="600" r="20"/>
    <text class="t-label-strong" x="1156" y="608" text-anchor="middle">4</text>

    <!-- 5: result returns to user space -->
    <line class="l-data" x1="1336" y1="584" x2="1336" y2="410" marker-end="url(#arrow-data)"/>
    <text class="t-label" x="1352" y="476">result</text>
    <circle class="c-ink" cx="1296" cy="468" r="20"/>
    <text class="t-label-strong" x="1296" y="476" text-anchor="middle">5</text>
  </g>

  <!-- ===== footer (§5.2) — do not change ===== -->
  <g id="footer">
