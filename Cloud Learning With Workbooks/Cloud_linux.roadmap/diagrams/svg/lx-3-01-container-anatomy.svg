  <!-- ===== content (§4: x 64–1536, y 184–812) ===== -->
  <g id="content">

    <!-- comparison divider (stops above the shared hardware, §11) -->
    <line class="s-boundary" x1="800" y1="200" x2="800" y2="660"/>

    <!-- panel labels -->
    <text class="t-label-strong" x="432" y="224" text-anchor="middle">Virtual machines</text>
    <text class="t-label-strong" x="1168" y="224" text-anchor="middle">Containers</text>

    <!-- ===================== LEFT: virtual machines ===================== -->
    <!-- VM 1 -->
    <rect class="s-boundary" x="120" y="248" width="300" height="272" rx="4"/>
    <text class="t-note" x="136" y="284">VM 1</text>
    <rect class="c-compute" x="140" y="300" width="260" height="64" rx="16"/>
    <text class="t-label" x="270" y="340" text-anchor="middle">App</text>
    <rect class="c-software" x="140" y="428" width="260" height="76" rx="4"/>
    <text class="t-label" x="270" y="474" text-anchor="middle">Guest OS + kernel</text>

    <!-- VM 2 -->
    <rect class="s-boundary" x="448" y="248" width="300" height="272" rx="4"/>
    <text class="t-note" x="464" y="284">VM 2</text>
    <rect class="c-compute" x="468" y="300" width="260" height="64" rx="16"/>
    <text class="t-label" x="598" y="340" text-anchor="middle">App</text>
    <rect class="c-software" x="468" y="428" width="260" height="76" rx="4"/>
    <text class="t-label" x="598" y="474" text-anchor="middle">Guest OS + kernel</text>

    <!-- hypervisor layer -->
    <rect class="c-software" x="120" y="576" width="628" height="60" rx="4"/>
    <text class="t-label-strong" x="434" y="614" text-anchor="middle">Hypervisor</text>

    <!-- left note -->
    <text class="t-note" x="434" y="546" text-anchor="middle">Each VM has its own OS and kernel.</text>

    <!-- ===================== RIGHT: containers ===================== -->
    <!-- Container A (dashed boundary = namespace) -->
    <rect class="s-boundary" x="856" y="248" width="300" height="272" rx="4"/>
    <text class="t-note" x="872" y="284">Container A</text>
    <rect class="c-compute" x="880" y="300" width="252" height="64" rx="16"/>
    <text class="t-label" x="1006" y="340" text-anchor="middle">nginx (PID 1)</text>
    <rect class="c-compute" x="880" y="396" width="252" height="64" rx="16"/>
    <text class="t-label" x="1006" y="436" text-anchor="middle">worker</text>

    <!-- Container B -->
    <rect class="s-boundary" x="1184" y="248" width="300" height="272" rx="4"/>
    <text class="t-note" x="1200" y="284">Container B</text>
    <rect class="c-compute" x="1208" y="300" width="252" height="64" rx="16"/>
    <text class="t-label" x="1334" y="340" text-anchor="middle">redis (PID 1)</text>
    <rect class="c-compute" x="1208" y="396" width="252" height="64" rx="16"/>
    <text class="t-label" x="1334" y="436" text-anchor="middle">worker</text>

    <!-- single shared kernel -->
    <rect class="c-software" x="856" y="576" width="628" height="60" rx="4"/>
    <text class="t-label-strong" x="1170" y="614" text-anchor="middle">Host kernel (shared)</text>

    <!-- right note -->
    <text class="t-note" x="1170" y="546" text-anchor="middle">namespace isolates each one; cgroup caps its CPU and RAM.</text>

    <!-- ===================== shared physical machine ===================== -->
    <rect class="c-compute" x="120" y="676" width="1364" height="60" rx="4"/>
    <text class="t-label-strong" x="802" y="714" text-anchor="middle">Server hardware — one physical machine</text>

    <!-- bottom summary -->
    <text class="t-note" x="800" y="784" text-anchor="middle">The real difference: many separate kernels (left) vs one shared kernel (right).</text>

  </g>

