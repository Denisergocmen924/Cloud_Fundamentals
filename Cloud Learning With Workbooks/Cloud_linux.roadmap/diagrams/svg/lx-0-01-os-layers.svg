    <text class="t-label-strong" x="64" y="264">Programs</text>
    <rect class="c-ink" x="272" y="192" width="1264" height="128" rx="4"/>
    <rect class="c-software" x="320" y="224" width="256" height="64" rx="16"/>
    <text class="t-label" x="448" y="264" text-anchor="middle">SSH server</text>
    <rect class="c-software" x="624" y="224" width="256" height="64" rx="16"/>
    <text class="t-label" x="752" y="264" text-anchor="middle">Web service</text>
    <rect class="c-software" x="928" y="224" width="256" height="64" rx="16"/>
    <text class="t-label" x="1056" y="264" text-anchor="middle">Log collector</text>
    <rect class="c-software" x="1232" y="224" width="256" height="64" rx="16"/>
    <text class="t-label" x="1360" y="264" text-anchor="middle">Your shell</text>

