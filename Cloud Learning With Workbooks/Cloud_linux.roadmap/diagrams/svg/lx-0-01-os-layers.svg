    <text class="t-label" x="464" y="376">request</text>

    <!-- ===== kernel ===== -->
    <text class="t-label-strong" x="64" y="496">Kernel</text>
    <text class="t-note" x="64" y="528">the referee</text>
    <rect class="c-software" x="272" y="416" width="1264" height="144" rx="4"/>
    <rect class="c-ink" x="320" y="448" width="320" height="80" rx="16"/>
    <text class="t-label-strong" x="480" y="496" text-anchor="middle">Abstraction</text>
    <rect class="c-ink" x="744" y="448" width="320" height="80" rx="16"/>
