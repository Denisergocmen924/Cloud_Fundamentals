<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">

  <style>
    /* ---------- Text (§7) ---------- */
    text { font-family: "Noto Sans", "DejaVu Sans", sans-serif; fill: #111827; }
    .t-title        { font-size: 40px; font-weight: 700; }
    .t-subtitle     { font-size: 26px; font-weight: 400; fill: #4B5563; }
    .t-fig          { font-size: 24px; font-weight: 600; fill: #4B5563; }
    .t-box          { font-size: 26px; font-weight: 700; }
    .t-role         { font-size: 20px; font-weight: 400; fill: #4B5563; }
    .t-label        { font-size: 24px; font-weight: 400; }
    .t-label-strong { font-size: 24px; font-weight: 600; }
    .t-verb         { font-size: 22px; font-weight: 700; fill: #111827; }
    .t-note         { font-size: 20px; font-weight: 400; fill: #4B5563; }
    .t-sign         { font-size: 20px; font-weight: 400; fill: #6B7280; }
    .t-danger       { fill: #B91C1C; font-weight: 700; }
    .t-mono         { font-family: "DejaVu Sans Mono", monospace; font-size: 20px; }

    /* ---------- Domain colors (§8.2) ---------- */
    .c-storage  { fill: #FFEDD5; stroke: #C2410C; stroke-width: 2; }
    .c-memory   { fill: #DCFCE7; stroke: #15803D; stroke-width: 2; }
    .c-software { fill: #F3F4F6; stroke: #374151; stroke-width: 2; }
    .c-problem  { fill: #FEE2E2; stroke: #B91C1C; stroke-width: 2; }

    /* ---------- Shapes (§9) ---------- */
    .s-boundary { fill: none; stroke: #6B7280; stroke-width: 2; stroke-dasharray: 8 6; }

    /* ---------- Lines (§10) ---------- */
    .l-data    { fill: none; stroke: #111827; stroke-width: 4; }
    .l-plain   { fill: none; stroke: #374151; stroke-width: 2; }
    .l-rule    { fill: none; stroke: #E5E7EB; stroke-width: 2; }
  </style>

  <defs>
    <marker id="arrow-data" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L16,8 L0,16 z" fill="#111827"/>
    </marker>
  </defs>

  <!-- ===== background ===== -->
  <g id="background">
    <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  </g>

  <!-- ===== title (§5.1) ===== -->
  <g id="title">
    <text class="t-title" x="64" y="88">6.6 Cloud storage flow — EBS to a persistent mount</text>
    <text class="t-subtitle" x="64" y="132">Existing on lsblk is not the same as usable on df</text>
    <text class="t-fig" x="1536" y="88" text-anchor="end">Figure 6.1</text>
    <line class="l-rule" x1="64" y1="160" x2="1536" y2="160"/>
  </g>

  <!-- ===== content (§4: x 64–1536, y 184–812) ===== -->
  <g id="content">

    <text class="t-label-strong" x="64" y="228">EBS volume attached</text>

    <!-- ===================== main flow row ===================== -->
    <!-- 4 boxes, width 300, gap 90; y 252, height 132 -->
    <!-- 1 block device -->
    <rect class="c-storage" x="64" y="252" width="300" height="132" rx="8"/>
    <text class="t-box"  x="214" y="308" text-anchor="middle">Block device</text>
    <text class="t-role t-mono" x="214" y="344" text-anchor="middle">/dev/nvme1n1</text>

    <!-- 2 filesystem -->
    <rect class="c-memory" x="454" y="252" width="300" height="132" rx="8"/>
    <text class="t-box"  x="604" y="308" text-anchor="middle">Filesystem</text>
    <text class="t-role" x="604" y="344" text-anchor="middle">ext4 written on it</text>

    <!-- 3 mounted -->
    <rect class="c-software" x="844" y="252" width="300" height="132" rx="8"/>
    <text class="t-box"  x="994" y="308" text-anchor="middle">Mounted</text>
    <text class="t-role t-mono" x="994" y="344" text-anchor="middle">/data  in the tree</text>

    <!-- 4 persistent -->
    <rect class="c-software" x="1234" y="252" width="300" height="132" rx="8"/>
    <text class="t-box"  x="1384" y="302" text-anchor="middle">Persistent</text>
    <text class="t-role" x="1384" y="334" text-anchor="middle">fstab UUID line</text>
    <text class="t-role" x="1384" y="360" text-anchor="middle">survives reboot</text>

    <!-- flow arrows + verbs (y 318) -->
    <line class="l-data" x1="366" y1="318" x2="452" y2="318" marker-end="url(#arrow-data)"/>
    <text class="t-verb" x="409" y="240" text-anchor="middle">mkfs</text>
    <text class="t-note" x="409" y="404" text-anchor="middle">format (erases)</text>

    <line class="l-data" x1="756" y1="318" x2="842" y2="318" marker-end="url(#arrow-data)"/>
    <text class="t-verb" x="799" y="240" text-anchor="middle">mount</text>

    <line class="l-data" x1="1146" y1="318" x2="1232" y2="318" marker-end="url(#arrow-data)"/>
    <text class="t-verb" x="1189" y="240" text-anchor="middle">blkid + fstab</text>

    <!-- ===================== what each tool sees ===================== -->
    <!-- lsblk bracket under box 1 -->
    <line class="l-plain" x1="214" y1="384" x2="214" y2="470" marker-end="url(#arrow-data)"/>
    <text class="t-label-strong" x="214" y="502" text-anchor="middle">lsblk sees it here</text>
    <text class="t-note" x="214" y="530" text-anchor="middle">a raw device — no format yet</text>

    <!-- df bracket under box 3 -->
    <line class="l-plain" x1="994" y1="384" x2="994" y2="470" marker-end="url(#arrow-data)"/>
    <text class="t-label-strong" x="994" y="502" text-anchor="middle">df sees it only from here</text>
    <text class="t-note" x="994" y="530" text-anchor="middle">"attached but not in df" = not yet mounted</text>

    <!-- boundary around the tool-sight lesson -->
    <rect class="s-boundary" x="64" y="440" width="1080" height="120" rx="8"/>

    <!-- ===================== danger callout ===================== -->
    <rect class="c-problem" x="64" y="620" width="1470" height="150" rx="8"/>
    <text class="t-label-strong t-danger" x="799" y="664" text-anchor="middle">A wrong /etc/fstab line = the machine will not boot (drops to maintenance mode)</text>
    <text class="t-note" x="799" y="700" text-anchor="middle">Use UUID (not the device name — it can shift on reboot) and add nofail for data disks.</text>
    <text class="t-label-strong t-danger" x="799" y="740" text-anchor="middle">Golden rule: run  sudo mount -a  to verify BEFORE you reboot.</text>
    <!-- arrow from persistent box down into danger -->
    <line class="l-data" x1="1384" y1="384" x2="1384" y2="618" marker-end="url(#arrow-data)"/>

  </g>

  <!-- ===== footer (§5.2) — do not change ===== -->
  <g id="footer">
    <line class="l-rule" x1="64" y1="836" x2="1536" y2="836"/>
    <text class="t-sign" x="64" y="876" xml:space="preserve">Created by Denis Ergöçmen    GitHub: https://github.com/Denisergocmen924</text>
  </g>

</svg>
