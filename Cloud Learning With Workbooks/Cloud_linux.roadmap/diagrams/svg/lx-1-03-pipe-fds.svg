  <!-- ===== content (§4: x 64–1536, y 184–812) ===== -->
  <g id="content">
    <!-- Top: two processes with their fd tables. Bottom: the pipe buffer in the kernel.
         Data leaves ls through fd 1, passes through the buffer, and enters grep through fd 0. -->

    <!-- ===== user space ===== -->
    <rect class="s-boundary" x="64" y="192" width="1472" height="380" rx="4"/>
    <text class="t-label-strong" x="88" y="228">User space</text>

    <!-- ls process -->
    <rect class="c-compute" x="112" y="252" width="480" height="296" rx="16"/>
    <text class="t-label-strong" x="136" y="292">ls</text>
    <text class="t-note" x="568" y="292" text-anchor="end">writes to fd 1</text>
    <rect class="c-io" x="136" y="316" width="432" height="64" rx="4"/>
    <text class="t-value" x="160" y="356">fd 0</text>
    <text class="t-label" x="544" y="356" text-anchor="end">terminal</text>
    <rect class="c-memory" x="136" y="388" width="432" height="64" rx="16"/>
    <text class="t-value" x="160" y="428">fd 1</text>
    <text class="t-label" x="544" y="428" text-anchor="end">pipe, write end</text>
    <rect class="c-io" x="136" y="460" width="432" height="64" rx="4"/>
    <text class="t-value" x="160" y="500">fd 2</text>
    <text class="t-label" x="544" y="500" text-anchor="end">terminal</text>

    <!-- grep process -->
    <rect class="c-compute" x="1008" y="252" width="480" height="296" rx="16"/>
    <text class="t-label-strong" x="1032" y="292">grep log</text>
    <text class="t-note" x="1464" y="292" text-anchor="end">reads from fd 0</text>
    <rect class="c-memory" x="1032" y="316" width="432" height="64" rx="16"/>
    <text class="t-value" x="1056" y="356">fd 0</text>
    <text class="t-label" x="1440" y="356" text-anchor="end">pipe, read end</text>
    <rect class="c-io" x="1032" y="388" width="432" height="64" rx="4"/>
    <text class="t-value" x="1056" y="428">fd 1</text>
    <text class="t-label" x="1440" y="428" text-anchor="end">terminal</text>
    <rect class="c-io" x="1032" y="460" width="432" height="64" rx="4"/>
    <text class="t-value" x="1056" y="500">fd 2</text>
    <text class="t-label" x="1440" y="500" text-anchor="end">terminal</text>

    <!-- ===== kernel space ===== -->
    <rect class="s-boundary" x="64" y="596" width="1472" height="200" rx="4"/>
    <text class="t-label-strong" x="88" y="632">Kernel space</text>

    <rect class="c-memory" x="560" y="648" width="480" height="120" rx="16"/>
    <text class="t-label-strong" x="800" y="700" text-anchor="middle">Pipe buffer</text>
    <text class="t-note" x="800" y="736" text-anchor="middle">64 KiB in RAM, nothing on disk</text>

    <!-- ===== data path ===== -->
    <polyline class="l-data" points="568,420 720,420 720,646" marker-end="url(#arrow-data)"/>
    <text class="t-label" x="736" y="500">write end</text>

    <polyline class="l-data" points="880,648 880,348 1030,348" marker-end="url(#arrow-data)"/>
    <text class="t-label" x="896" y="500">read end</text>
  </g>

