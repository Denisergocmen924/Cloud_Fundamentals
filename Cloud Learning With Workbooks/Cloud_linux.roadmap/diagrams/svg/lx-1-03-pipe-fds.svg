  <g id="title">
    <text class="t-title" x="64" y="88">1.4.2 Redirection and pipes</text>
    <text class="t-subtitle" x="64" y="132">ls | grep log: two processes, one pipe</text>
    <text class="t-fig" x="1536" y="88" text-anchor="end">Figure 1.3</text>
