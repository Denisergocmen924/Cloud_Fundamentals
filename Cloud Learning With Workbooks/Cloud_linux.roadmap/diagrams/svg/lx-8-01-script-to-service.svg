  subject:          Linux
  figure:           8.1
  section:          8.2 From a script to a managed service
  subtitle:         Starting a process is not the same as managing a service
  type:             Comparison
  source:           Cloud Learning With Workbooks/Cloud_linux.roadmap/English_Linux/Phase_8_Packages_and_Service_ization.md
  boundary:         sections 8.2.1, 8.2.2 — the two ways to run your app
  height:           900
  number-conflicts: none
  scale:            not to scale (contrast of two approaches)
  ============================================================

  Rules: diagram_example/Standard_Rules_Diagrams.md
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">

  <style>
    text { font-family: "Noto Sans", "DejaVu Sans", sans-serif; fill: #111827; }
    .t-title        { font-size: 40px; font-weight: 700; }
    .t-subtitle     { font-size: 26px; font-weight: 400; fill: #4B5563; }
    .t-fig          { font-size: 24px; font-weight: 600; fill: #4B5563; }
    .t-box          { font-size: 26px; font-weight: 700; }
    .t-role         { font-size: 20px; font-weight: 400; fill: #4B5563; }
    .t-label        { font-size: 24px; font-weight: 400; }
    .t-label-strong { font-size: 24px; font-weight: 600; }
    .t-item         { font-size: 22px; font-weight: 400; }
    .t-note         { font-size: 20px; font-weight: 400; fill: #4B5563; }
    .t-sign         { font-size: 20px; font-weight: 400; fill: #6B7280; }
    .t-good         { fill: #15803D; font-weight: 700; }
    .t-bad          { fill: #B91C1C; font-weight: 700; }
    .t-mono         { font-family: "DejaVu Sans Mono", monospace; font-size: 20px; }

    .c-software { fill: #F3F4F6; stroke: #374151; stroke-width: 2; }
    .c-memory   { fill: #DCFCE7; stroke: #15803D; stroke-width: 2; }
    .c-problem  { fill: #FEE2E2; stroke: #B91C1C; stroke-width: 2; }

    .s-boundary { fill: none; stroke: #6B7280; stroke-width: 2; stroke-dasharray: 8 6; }

    .l-data    { fill: none; stroke: #111827; stroke-width: 4; }
    .l-rule    { fill: none; stroke: #E5E7EB; stroke-width: 2; }
  </style>

  <defs>
    <marker id="arrow-data" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L16,8 L0,16 z" fill="#111827"/>
    </marker>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  </g>

  <g id="title">
    <text class="t-title" x="64" y="88">8.2 From a script to a managed service</text>
    <text class="t-subtitle" x="64" y="132">Starting a process is not the same as managing a service</text>
    <text class="t-fig" x="1536" y="88" text-anchor="end">Figure 8.1</text>
    <line class="l-rule" x1="64" y1="160" x2="1536" y2="160"/>
  </g>

  <g id="content">

    <!-- shared start -->
    <rect class="c-software" x="600" y="196" width="400" height="80" rx="8"/>
    <text class="t-box" x="800" y="234" text-anchor="middle">Your app</text>
    <text class="t-role t-mono" x="800" y="262" text-anchor="middle">app.py  (installed on disk)</text>

    <!-- two arrows down to the two approaches -->
    <line class="l-data" x1="800" y1="276" x2="360" y2="332" marker-end="url(#arrow-data)"/>
    <line class="l-data" x1="800" y1="276" x2="1240" y2="332" marker-end="url(#arrow-data)"/>

    <!-- ================= LEFT: nohup (fragile) ================= -->
    <rect class="c-problem" x="64" y="336" width="700" height="404" rx="8"/>
    <text class="t-box t-bad" x="414" y="382" text-anchor="middle">nohup python app.py &amp;</text>
    <text class="t-label-strong t-bad" x="414" y="416" text-anchor="middle">a process — but nobody manages it</text>

    <line class="l-rule" x1="96" y1="440" x2="732" y2="440"/>

    <text class="t-item" x="112" y="486">✗  crashes → stays down (no one restarts)</text>
    <text class="t-note" x="140" y="512">Phase 3/4: the process just dies</text>

    <text class="t-item" x="112" y="560">✗  reboot → gone (no boot-start)</text>
    <text class="t-note" x="140" y="586">Phase 5: nothing brings it back</text>

    <text class="t-item" x="112" y="634">✗  logs scattered in nohup.out</text>
    <text class="t-note" x="140" y="660">not in journalctl, not rotated</text>

    <text class="t-item" x="112" y="708">✗  dies when your shell logs out</text>

    <!-- ================= RIGHT: systemd (managed) ================= -->
    <rect class="c-memory" x="836" y="336" width="700" height="404" rx="8"/>
    <text class="t-box t-good" x="1186" y="382" text-anchor="middle">myapp.service  (systemd unit)</text>
    <text class="t-label-strong t-good" x="1186" y="416" text-anchor="middle">a managed service</text>

    <line class="l-rule" x1="868" y1="440" x2="1504" y2="440"/>

    <text class="t-item" x="884" y="486">✓  crashes → auto-restart</text>
    <text class="t-note t-mono" x="912" y="512">Restart=on-failure</text>

    <text class="t-item" x="884" y="560">✓  reboot → starts on boot</text>
    <text class="t-note t-mono" x="912" y="586">systemctl enable</text>

    <text class="t-item" x="884" y="634">✓  logs central in journald</text>
    <text class="t-note t-mono" x="912" y="660">journalctl -u myapp</text>

    <text class="t-item" x="884" y="708">✓  independent of your session</text>

    <!-- lesson banner -->
    <rect class="s-boundary" x="64" y="764" width="1472" height="48" rx="8"/>
    <text class="t-label-strong" x="800" y="794" text-anchor="middle">Installed on disk ≠ running as a managed service — the unit + enable is what closes the gap.</text>

  </g>

  <g id="footer">
    <line class="l-rule" x1="64" y1="836" x2="1536" y2="836"/>
    <text class="t-sign" x="64" y="876" xml:space="preserve">Created by Denis Ergöçmen    GitHub: https://github.com/Denisergocmen924</text>
  </g>

</svg>
