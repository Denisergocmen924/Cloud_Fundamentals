<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">

  <style>
    /* ---------- Text (§7) ---------- */
    text { font-family: "Noto Sans", "DejaVu Sans", sans-serif; fill: #111827; }
    .t-title        { font-size: 40px; font-weight: 700; }
    .t-subtitle     { font-size: 26px; font-weight: 400; fill: #4B5563; }
    .t-fig          { font-size: 24px; font-weight: 600; fill: #4B5563; }
    .t-label        { font-size: 24px; font-weight: 400; }
    .t-label-strong { font-size: 24px; font-weight: 600; }
    .t-value        { font-size: 22px; font-weight: 400; font-family: "Noto Sans Mono", "DejaVu Sans Mono", monospace; }
    .t-note         { font-size: 20px; font-weight: 400; fill: #4B5563; }
    .t-sign         { font-size: 20px; font-weight: 400; fill: #6B7280; }
    .t-problem      { fill: #DC2626; }
    .t-good         { fill: #15803D; }

    /* ---------- Domain colors (§8.2) — same meaning in every subject ---------- */
    .c-compute  { fill: #DBEAFE; stroke: #1D4ED8; stroke-width: 2; }
    .c-memory   { fill: #DCFCE7; stroke: #15803D; stroke-width: 2; }
    .c-storage  { fill: #FFEDD5; stroke: #C2410C; stroke-width: 2; }
    .c-io       { fill: #FEF9C3; stroke: #A16207; stroke-width: 2; }
    .c-network  { fill: #EDE9FE; stroke: #6D28D9; stroke-width: 2; }
    .c-virt     { fill: #CCFBF1; stroke: #0F766E; stroke-width: 2; }
    .c-security { fill: #FCE7F3; stroke: #9D174D; stroke-width: 2; }
    .c-software { fill: #F3F4F6; stroke: #374151; stroke-width: 2; }
    .c-ink      { fill: #FFFFFF; stroke: #111827; stroke-width: 2; }
    .c-problem  { fill: #FEE2E2; stroke: #DC2626; stroke-width: 2; }

    /* ---------- Shapes (§9) ---------- */
    .s-boundary { fill: none; stroke: #6B7280; stroke-width: 2; stroke-dasharray: 8 6; }

    /* ---------- Lines (§10) ---------- */
    .l-data    { fill: none; stroke: #111827; stroke-width: 4; }
    .l-plain   { fill: none; stroke: #374151; stroke-width: 2; }
    .l-rule    { fill: none; stroke: #E5E7EB; stroke-width: 2; }
  </style>

  <defs>
    <marker id="arrow-data" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L16,8 L0,16 z" fill="#111827"/>
    </marker>
  </defs>

  <!-- ===== background ===== -->
  <g id="background">
    <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  </g>

  <!-- ===== title (§5.1) ===== -->
  <g id="title">
    <text class="t-title" x="64" y="88">4.2 Page cache — the "free RAM" fallacy</text>
    <text class="t-subtitle" x="64" y="132">The same 16 GB, read two ways</text>
    <text class="t-fig" x="1536" y="88" text-anchor="end">Figure 4.1</text>
    <line class="l-rule" x1="64" y1="160" x2="1536" y2="160"/>
  </g>

  <!-- ===== content (§4: x 64–1536, y 184–812) ===== -->
  <g id="content">

    <!-- comparison divider -->
    <line class="s-boundary" x1="800" y1="200" x2="800" y2="676"/>

    <!-- panel labels -->
    <text class="t-label-strong t-problem" x="432" y="224" text-anchor="middle">Naive reading — "used vs total"</text>
    <text class="t-label-strong t-good" x="1168" y="224" text-anchor="middle">Real model — read "available"</text>

    <!-- ===================== LEFT: naive / wrong ===================== -->
    <!-- the free -h line, read wrongly -->
    <text class="t-value" x="120" y="272">total 16Gi</text>
    <text class="t-value" x="120" y="300">free   0.3Gi</text>

    <!-- one bar: everything that is not 'free' looks "used" -->
    <!-- bar geometry: x 120..744 (624 wide) = 16 GB ; used+cache = ~15GB -->
    <rect class="c-problem" x="120" y="332" width="612" height="120" rx="4"/>
    <rect class="c-software" x="720" y="332" width="12" height="120" rx="2"/>
    <text class="t-label-strong t-problem" x="426" y="400" text-anchor="middle">"USED" 15.7 GB</text>
    <text class="t-note" x="426" y="430" text-anchor="middle">(used + buff/cache lumped together)</text>
    <text class="t-note" x="726" y="322" text-anchor="middle">free</text>

    <!-- scale ticks -->
    <line class="l-plain" x1="120" y1="452" x2="120" y2="468"/>
    <line class="l-plain" x1="732" y1="452" x2="732" y2="468"/>
    <text class="t-note" x="120" y="492">0</text>
    <text class="t-note" x="732" y="492" text-anchor="end">16 GB</text>

    <!-- verdict -->
    <rect class="c-problem" x="120" y="560" width="612" height="96" rx="8"/>
    <text class="t-label-strong t-problem" x="426" y="600" text-anchor="middle">"RAM is 98% full — panic!"</text>
    <text class="t-note" x="426" y="632" text-anchor="middle">→ buys a bigger instance for nothing</text>

    <!-- ===================== RIGHT: real model ===================== -->
    <text class="t-value" x="856" y="272">used 2.0Gi   buff/cache 13.7Gi</text>
    <text class="t-value" x="856" y="300">available 12.0Gi</text>

    <!-- bar split into used / cache / free, to scale -->
    <!-- x 856..1480 (624 wide) = 16 GB ; used 2GB=78px, cache 13.7GB=534px, free 0.3GB=12px -->
    <rect class="c-memory" x="856" y="332" width="78" height="120" rx="4"/>
    <rect class="c-storage" x="934" y="332" width="534" height="120" rx="4"/>
    <rect class="c-software" x="1468" y="332" width="12" height="120" rx="2"/>
    <text class="t-note" x="895" y="484" text-anchor="middle">used</text>
    <text class="t-label-strong" x="1201" y="392" text-anchor="middle">page cache 13.7 GB</text>
    <text class="t-note" x="1201" y="422" text-anchor="middle">reclaimable — handed back on demand</text>

    <!-- available bracket spans cache + free -->
    <line class="l-data" x1="934" y1="500" x2="1480" y2="500" marker-start="url(#arrow-data)" marker-end="url(#arrow-data)"/>
    <text class="t-label-strong t-good" x="1207" y="532" text-anchor="middle">available = 12 GB</text>

    <!-- verdict -->
    <rect class="c-memory" x="856" y="560" width="624" height="96" rx="8"/>
    <text class="t-label-strong t-good" x="1168" y="600" text-anchor="middle">"used is only 2 GB — system is relaxed"</text>
    <text class="t-note" x="1168" y="632" text-anchor="middle">→ alarm only when available drops low</text>

    <!-- ===================== bottom summary ===================== -->
    <text class="t-note" x="800" y="712" text-anchor="middle">Same machine, same free -h output. The number that decides "is RAM full?" is available — not used, not free.</text>

  </g>

  <!-- ===== footer (§5.2) — do not change ===== -->
  <g id="footer">
    <line class="l-rule" x1="64" y1="836" x2="1536" y2="836"/>
    <text class="t-sign" x="64" y="876" xml:space="preserve">Created by Denis Ergöçmen    GitHub: https://github.com/Denisergocmen924</text>
  </g>

</svg>
