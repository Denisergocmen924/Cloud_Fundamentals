  subtitle:         The same 16 GB, read two ways
  type:             Comparison
  source:           Cloud Learning With Workbooks/Cloud_linux.roadmap/English_Linux/Phase_4_Memory_IO_Performance.md
  boundary:         text from the start of the file down to the "Figure 4.1" line (4.1-4.2.1)
  height:           900
