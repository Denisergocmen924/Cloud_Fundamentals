<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">

  <style>
    text { font-family: "Noto Sans", "DejaVu Sans", sans-serif; fill: #111827; }
    .t-title        { font-size: 40px; font-weight: 700; }
    .t-subtitle     { font-size: 26px; font-weight: 400; fill: #4B5563; }
    .t-fig          { font-size: 24px; font-weight: 600; fill: #4B5563; }
    .t-layer        { font-size: 22px; font-weight: 700; }
    .t-layer-note   { font-size: 18px; font-weight: 400; fill: #4B5563; }
    .t-core         { font-size: 24px; font-weight: 700; fill: #15803D; }
    .t-core-note    { font-size: 18px; font-weight: 400; fill: #15803D; }
    .t-attacker     { font-size: 24px; font-weight: 700; fill: #B91C1C; }
    .t-label-strong { font-size: 24px; font-weight: 600; }
    .t-sign         { font-size: 20px; font-weight: 400; fill: #6B7280; }
    .t-mono         { font-family: "DejaVu Sans Mono", monospace; }

    .c-software { fill: #F3F4F6; stroke: #374151; stroke-width: 2; }
    .c-memory   { fill: #DCFCE7; stroke: #15803D; stroke-width: 2; }
    .c-problem  { fill: #FEE2E2; stroke: #B91C1C; stroke-width: 2; }

    .s-boundary { fill: none; stroke: #6B7280; stroke-width: 2; stroke-dasharray: 8 6; }
    .l-rule     { fill: none; stroke: #E5E7EB; stroke-width: 2; }
    .l-attack   { fill: none; stroke: #B91C1C; stroke-width: 4; }
  </style>

  <defs>
    <marker id="arrow-attack" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L16,8 L0,16 z" fill="#B91C1C"/>
    </marker>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  </g>

  <g id="title">
    <text class="t-title" x="64" y="88">9.1 Defense in depth</text>
    <text class="t-subtitle" x="64" y="132">Security is layers, not a single wall — each layer shrinks the blast radius</text>
    <text class="t-fig" x="1536" y="88" text-anchor="end">Figure 9.1</text>
    <line class="l-rule" x1="64" y1="160" x2="1536" y2="160"/>
  </g>

  <g id="content">

    <!-- attacker on the far left -->
    <rect class="c-problem" x="64" y="360" width="150" height="120" rx="8"/>
    <text class="t-attacker" x="139" y="410" text-anchor="middle">Attacker</text>
    <text class="t-layer-note" x="139" y="440" text-anchor="middle">from the</text>
    <text class="t-layer-note" x="139" y="462" text-anchor="middle">internet</text>
    <line class="l-attack" x1="214" y1="420" x2="356" y2="420" marker-end="url(#arrow-attack)"/>

    <!-- ===== concentric layers, outer -> inner (labels in each top band) ===== -->
    <!-- L1: Network (Phase 7) -->
    <rect class="c-software" x="360" y="196" width="1176" height="420" rx="12"/>
    <text class="t-layer" x="948" y="236" text-anchor="middle">① Network  —  Security Group + host firewall</text>
    <text class="t-layer-note t-mono" x="948" y="262" text-anchor="middle">Phase 7 · default-deny, only needed ports open</text>

    <!-- L2: Access -->
    <rect class="c-software" x="456" y="272" width="984" height="344" rx="12"/>
    <text class="t-layer" x="948" y="312" text-anchor="middle">② Access  —  SSH key-only, root login off</text>
    <text class="t-layer-note t-mono" x="948" y="338" text-anchor="middle">§9.2 · PasswordAuthentication no · PermitRootLogin no</text>

    <!-- L3: Least privilege -->
    <rect class="c-software" x="552" y="348" width="792" height="268" rx="12"/>
    <text class="t-layer" x="948" y="388" text-anchor="middle">③ Least privilege  —  non-root + capabilities</text>
    <text class="t-layer-note t-mono" x="948" y="414" text-anchor="middle">§9.1/9.5 · User=appuser · CAP_NET_BIND_SERVICE only</text>

    <!-- L4: MAC -->
    <rect class="c-software" x="648" y="424" width="600" height="192" rx="12"/>
    <text class="t-layer" x="948" y="464" text-anchor="middle">④ MAC  —  AppArmor / SELinux profile</text>
    <text class="t-layer-note t-mono" x="948" y="490" text-anchor="middle">§9.3 · second lock over DAC, root cannot loosen it</text>

    <!-- Core: App + secrets -->
    <rect class="c-memory" x="744" y="500" width="408" height="100" rx="10"/>
    <text class="t-core" x="948" y="540" text-anchor="middle">⑤ App + secrets</text>
    <text class="t-core-note" x="948" y="568" text-anchor="middle">§9.6 · secrets not on disk (IAM role)</text>
    <text class="t-core-note" x="948" y="590" text-anchor="middle">nothing to steal</text>

  </g>

  <g id="lesson">
    <rect class="s-boundary" x="360" y="640" width="1176" height="100" rx="8"/>
    <text class="t-label-strong" x="948" y="680" text-anchor="middle">One breached layer is not a full compromise: the attacker must defeat every layer.</text>
    <text class="t-layer-note" x="948" y="712" text-anchor="middle">Defense in depth = independent layers → each one shrinks the blast radius when the layer outside it fails.</text>
  </g>

  <g id="footer">
    <line class="l-rule" x1="64" y1="836" x2="1536" y2="836"/>
    <text class="t-sign" x="64" y="876" xml:space="preserve">Created by Denis Ergöçmen    GitHub: https://github.com/Denisergocmen924</text>
  </g>

</svg>
