    .c-problem  { fill: #FEE2E2; stroke: #DC2626; stroke-width: 2; }

    /* ---------- Shapes (§9) ---------- */
    .s-boundary { fill: none; stroke: #6B7280; stroke-width: 2; stroke-dasharray: 8 6; }
    .s-unit     { fill: #374151; stroke: none; }
    .s-dot      { fill: #111827; stroke: none; }

    /* ---------- Lines (§10) ---------- */
    .l-data    { fill: none; stroke: #111827; stroke-width: 4; }
    .l-control { fill: none; stroke: #111827; stroke-width: 2; }
    .l-async   { fill: none; stroke: #111827; stroke-width: 2; stroke-dasharray: 6 4; }
    .l-problem { fill: none; stroke: #DC2626; stroke-width: 4; }
    .l-plain   { fill: none; stroke: #374151; stroke-width: 2; }
    .l-rule    { fill: none; stroke: #E5E7EB; stroke-width: 2; }
    .l-guide   { fill: none; stroke: #E5E7EB; stroke-width: 2; }
  </style>

  <defs>
    <marker id="arrow-data" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L16,8 L0,16 z" fill="#111827"/>
    </marker>
    <marker id="arrow-control" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#111827"/>
    </marker>
    <marker id="arrow-problem" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L16,8 L0,16 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- ===== background ===== -->
  <g id="background">
    <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  </g>

  <!-- ===== title (§5.1) ===== -->
  <g id="title">
    <text class="t-title" x="64" y="88">1.1.2 How the shell finds a command</text>
    <text class="t-subtitle" x="64" y="132">From a typed line to a running program</text>
    <text class="t-fig" x="1536" y="88" text-anchor="end">Figure 1.1</text>
    <line class="l-rule" x1="64" y1="160" x2="1536" y2="160"/>
  </g>

  <!-- ===== content (§4: x 64–1536, y 184–812) ===== -->
  <g id="content">
    <!-- Five columns (x 96, 384, 672, 960, 1248; width 256). Top row: the five steps, left to right.
         Below each step: what happens inside it. -->

    <!-- ===== step row ===== -->
    <rect class="c-software" x="96" y="216" width="256" height="88" rx="16"/>
    <circle class="c-ink" cx="136" cy="260" r="20"/>
    <text class="t-label-strong" x="136" y="268" text-anchor="middle">1</text>
    <text class="t-label-strong" x="172" y="268">Split</text>

    <rect class="c-software" x="384" y="216" width="256" height="88" rx="16"/>
    <circle class="c-ink" cx="424" cy="260" r="20"/>
    <text class="t-label-strong" x="424" y="268" text-anchor="middle">2</text>
    <text class="t-label-strong" x="460" y="268">Expand</text>

    <rect class="c-software" x="672" y="216" width="256" height="88" rx="16"/>
    <circle class="c-ink" cx="712" cy="260" r="20"/>
    <text class="t-label-strong" x="712" y="268" text-anchor="middle">3</text>
    <text class="t-label-strong" x="748" y="268">Look up</text>

    <rect class="c-software" x="960" y="216" width="256" height="88" rx="16"/>
    <circle class="c-ink" cx="1000" cy="260" r="20"/>
    <text class="t-label-strong" x="1000" y="268" text-anchor="middle">4</text>
    <text class="t-label-strong" x="1036" y="268">Run it</text>

    <rect class="c-software" x="1248" y="216" width="256" height="88" rx="16"/>
    <circle class="c-ink" cx="1288" cy="260" r="20"/>
    <text class="t-label-strong" x="1288" y="268" text-anchor="middle">5</text>
    <text class="t-label-strong" x="1324" y="268">Exit code</text>

    <line class="l-data" x1="352" y1="260" x2="382" y2="260" marker-end="url(#arrow-data)"/>
    <line class="l-data" x1="640" y1="260" x2="670" y2="260" marker-end="url(#arrow-data)"/>
    <line class="l-data" x1="928" y1="260" x2="958" y2="260" marker-end="url(#arrow-data)"/>
    <line class="l-data" x1="1216" y1="260" x2="1246" y2="260" marker-end="url(#arrow-data)"/>

    <!-- step to detail -->
    <line class="l-control" x1="224" y1="304" x2="224" y2="350" marker-end="url(#arrow-control)"/>
    <line class="l-control" x1="512" y1="304" x2="512" y2="350" marker-end="url(#arrow-control)"/>
    <line class="l-control" x1="800" y1="304" x2="800" y2="350" marker-end="url(#arrow-control)"/>
    <line class="l-control" x1="1088" y1="304" x2="1088" y2="350" marker-end="url(#arrow-control)"/>
    <line class="l-control" x1="1376" y1="304" x2="1376" y2="350" marker-end="url(#arrow-control)"/>

    <!-- ===== 1: split into words ===== -->
    <rect class="c-ink" x="144" y="352" width="160" height="64" rx="16"/>
    <text class="t-value" x="224" y="392" text-anchor="middle">ls</text>
    <rect class="c-ink" x="144" y="436" width="160" height="64" rx="16"/>
    <text class="t-value" x="224" y="476" text-anchor="middle">-l</text>
    <rect class="c-ink" x="144" y="520" width="160" height="64" rx="16"/>
    <text class="t-value" x="224" y="560" text-anchor="middle">*.log</text>
    <text class="t-note" x="224" y="632" text-anchor="middle">first word = command</text>

    <!-- ===== 2: expand ===== -->
    <rect class="c-ink" x="384" y="352" width="256" height="232" rx="16"/>
    <text class="t-value" x="512" y="400" text-anchor="middle">$HOME</text>
    <text class="t-value" x="512" y="444" text-anchor="middle">→ /home/ubuntu</text>
    <text class="t-value" x="512" y="504" text-anchor="middle">*.log</text>
    <text class="t-value" x="512" y="548" text-anchor="middle">→ a.log b.log</text>
    <text class="t-note" x="512" y="632" text-anchor="middle">program never sees *</text>

    <!-- ===== 3: lookup order ===== -->
    <rect class="c-software" x="672" y="352" width="256" height="72" rx="16"/>
    <text class="t-label" x="800" y="396" text-anchor="middle">Alias</text>
    <rect class="c-software" x="672" y="444" width="256" height="72" rx="16"/>
    <text class="t-label" x="800" y="488" text-anchor="middle">Function</text>
    <rect class="c-software" x="672" y="536" width="256" height="72" rx="16"/>
    <text class="t-label" x="800" y="580" text-anchor="middle">Builtin</text>
    <rect class="c-storage" x="672" y="628" width="256" height="72" rx="16"/>
    <text class="t-label" x="800" y="672" text-anchor="middle">PATH directories</text>
    <text class="t-note" x="800" y="748" text-anchor="middle">first match wins</text>

    <!-- ===== 4: fork + execve ===== -->
    <rect class="c-compute" x="960" y="352" width="256" height="112" rx="16"/>
    <text class="t-label-strong" x="1088" y="400" text-anchor="middle">fork</text>
    <text class="t-note" x="1088" y="436" text-anchor="middle">shell copies itself</text>
    <line class="l-control" x1="1088" y1="464" x2="1088" y2="526" marker-end="url(#arrow-control)"/>
    <rect class="c-compute" x="960" y="528" width="256" height="112" rx="16"/>
    <text class="t-label-strong" x="1088" y="576" text-anchor="middle">execve</text>
    <text class="t-note" x="1088" y="612" text-anchor="middle">child becomes ls</text>
    <text class="t-note" x="1088" y="688" text-anchor="middle">builtins skip this step</text>

    <!-- ===== 5: wait and exit code ===== -->
    <rect class="c-compute" x="1248" y="352" width="256" height="112" rx="16"/>
    <text class="t-label-strong" x="1376" y="400" text-anchor="middle">Parent waits</text>
    <text class="t-value" x="1376" y="436" text-anchor="middle">wait4()</text>
    <line class="l-control" x1="1376" y1="464" x2="1376" y2="526" marker-end="url(#arrow-control)"/>
    <rect class="c-ink" x="1248" y="528" width="256" height="112" rx="16"/>
    <text class="t-label-strong" x="1376" y="576" text-anchor="middle">Stored in $?</text>
    <text class="t-value" x="1376" y="612" text-anchor="middle">$? = 0</text>
    <text class="t-note" x="1376" y="688" text-anchor="middle">0 = success</text>
  </g>

  <!-- ===== footer (§5.2) — do not change ===== -->
  <g id="footer">
