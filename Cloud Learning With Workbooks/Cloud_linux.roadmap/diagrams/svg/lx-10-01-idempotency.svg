<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">

  <style>
    text { font-family: "Noto Sans", "DejaVu Sans", sans-serif; fill: #111827; }
    .t-title        { font-size: 40px; font-weight: 700; }
    .t-subtitle     { font-size: 26px; font-weight: 400; fill: #4B5563; }
    .t-fig          { font-size: 24px; font-weight: 600; fill: #4B5563; }
    .t-box          { font-size: 25px; font-weight: 700; }
    .t-label        { font-size: 22px; font-weight: 600; }
    .t-item         { font-size: 21px; font-weight: 400; }
    .t-note         { font-size: 19px; font-weight: 400; fill: #4B5563; }
    .t-sign         { font-size: 20px; font-weight: 400; fill: #6B7280; }
    .t-good         { fill: #15803D; font-weight: 700; }
    .t-bad          { fill: #B91C1C; font-weight: 700; }
    .t-mono         { font-family: "DejaVu Sans Mono", monospace; font-size: 20px; }
    .t-run          { font-size: 20px; font-weight: 700; fill: #4B5563; }

    .c-software { fill: #F3F4F6; stroke: #374151; stroke-width: 2; }
    .c-memory   { fill: #DCFCE7; stroke: #15803D; stroke-width: 2; }
    .c-problem  { fill: #FEE2E2; stroke: #B91C1C; stroke-width: 2; }

    .s-boundary { fill: none; stroke: #6B7280; stroke-width: 2; stroke-dasharray: 8 6; }
    .l-rule    { fill: none; stroke: #E5E7EB; stroke-width: 2; }
    .l-flow    { fill: none; stroke: #111827; stroke-width: 3; }
  </style>

  <defs>
    <marker id="arrow-flow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L16,8 L0,16 z" fill="#111827"/>
    </marker>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  </g>

  <g id="title">
    <text class="t-title" x="64" y="88">10.4 Idempotency</text>
    <text class="t-subtitle" x="64" y="132">Running the same script twice — does the second run break anything?</text>
    <text class="t-fig" x="1536" y="88" text-anchor="end">Figure 10.1</text>
    <line class="l-rule" x1="64" y1="160" x2="1536" y2="160"/>
  </g>

  <g id="content">

    <!-- column headers -->
    <text class="t-run" x="470" y="200" text-anchor="middle">Run 1  →  Run 2</text>
    <text class="t-run" x="1130" y="200" text-anchor="middle">Run 1  →  Run 2</text>

    <!-- ================= LEFT: NOT idempotent ================= -->
    <rect class="c-problem" x="64" y="216" width="720" height="540" rx="10"/>
    <text class="t-box t-bad" x="424" y="258" text-anchor="middle">NOT idempotent</text>
    <text class="t-mono" x="424" y="292" text-anchor="middle">mkdir /opt/app</text>
    <text class="t-mono" x="424" y="320" text-anchor="middle">echo "line" &gt;&gt; app.conf</text>

    <line class="l-rule" x1="96" y1="344" x2="752" y2="344"/>

    <!-- run 1 -->
    <text class="t-label" x="112" y="386">Run 1</text>
    <text class="t-item" x="112" y="418">✓  creates /opt/app</text>
    <text class="t-item" x="112" y="448">✓  adds "line" to app.conf</text>
    <text class="t-note" x="140" y="474">reaches the desired state</text>

    <!-- run 2 -->
    <text class="t-label t-bad" x="112" y="528">Run 2  (same script again)</text>
    <text class="t-item t-bad" x="112" y="560">✗  mkdir: error, "/opt/app exists"</text>
    <text class="t-item t-bad" x="112" y="590">✗  adds "line" AGAIN → duplicated</text>
    <text class="t-note" x="140" y="616">app.conf now has the line twice</text>

    <rect class="s-boundary" x="96" y="648" width="656" height="80" rx="8"/>
    <text class="t-item t-bad" x="424" y="682" text-anchor="middle">Every repeat makes it worse.</text>
    <text class="t-note" x="424" y="710" text-anchor="middle">state drifts further from what you wanted</text>

    <!-- ================= RIGHT: idempotent ================= -->
    <rect class="c-memory" x="816" y="216" width="720" height="540" rx="10"/>
    <text class="t-box t-good" x="1176" y="258" text-anchor="middle">Idempotent</text>
    <text class="t-mono" x="1176" y="292" text-anchor="middle">mkdir -p /opt/app</text>
    <text class="t-mono" x="1176" y="320" text-anchor="middle">grep -qxF "line" .. || echo ..</text>

    <line class="l-rule" x1="848" y1="344" x2="1504" y2="344"/>

    <!-- run 1 -->
    <text class="t-label" x="864" y="386">Run 1</text>
    <text class="t-item" x="864" y="418">✓  creates /opt/app</text>
    <text class="t-item" x="864" y="448">✓  adds "line" to app.conf</text>
    <text class="t-note" x="892" y="474">reaches the desired state</text>

    <!-- run 2 -->
    <text class="t-label t-good" x="864" y="528">Run 2  (same script again)</text>
    <text class="t-item t-good" x="864" y="560">✓  -p: dir exists, no error</text>
    <text class="t-item t-good" x="864" y="590">✓  line already present, skips</text>
    <text class="t-note" x="892" y="616">nothing changes — same final state</text>

    <rect class="s-boundary" x="848" y="648" width="656" height="80" rx="8"/>
    <text class="t-item t-good" x="1176" y="682" text-anchor="middle">Same result, any number of runs.</text>
    <text class="t-note" x="1176" y="710" text-anchor="middle">state always equals what the code describes</text>

    <!-- lesson banner -->
    <rect class="s-boundary" x="64" y="760" width="1472" height="52" rx="8"/>
    <text class="t-label" x="800" y="793" text-anchor="middle">Idempotency: "describe the desired state, reach it safely again and again" — the foundation of IaC.</text>

  </g>

  <g id="footer">
    <line class="l-rule" x1="64" y1="836" x2="1536" y2="836"/>
    <text class="t-sign" x="64" y="876" xml:space="preserve">Created by Denis Ergöçmen    GitHub: https://github.com/Denisergocmen924</text>
  </g>

</svg>
