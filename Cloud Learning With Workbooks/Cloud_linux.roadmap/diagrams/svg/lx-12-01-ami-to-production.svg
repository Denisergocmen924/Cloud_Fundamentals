<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">

  <style>
    text { font-family: "Noto Sans", "DejaVu Sans", sans-serif; fill: #111827; }
    .t-title        { font-size: 40px; font-weight: 700; }
    .t-subtitle     { font-size: 26px; font-weight: 400; fill: #4B5563; }
    .t-fig          { font-size: 24px; font-weight: 600; fill: #4B5563; }
    .t-box          { font-size: 23px; font-weight: 700; }
    .t-aws          { font-size: 19px; font-weight: 400; fill: #374151; }
    .t-phase        { font-size: 18px; font-weight: 700; fill: #6B7280; }
    .t-label-strong { font-size: 22px; font-weight: 700; }
    .t-note         { font-size: 19px; font-weight: 400; fill: #4B5563; }
    .t-sign         { font-size: 20px; font-weight: 400; fill: #6B7280; }
    .t-good         { fill: #15803D; }

    .c-compute  { fill: #DBEAFE; stroke: #1D4ED8; stroke-width: 2; }
    .c-memory   { fill: #DCFCE7; stroke: #15803D; stroke-width: 2; }
    .c-storage  { fill: #FFEDD5; stroke: #C2410C; stroke-width: 2; }
    .c-software { fill: #F3F4F6; stroke: #374151; stroke-width: 2; }

    .s-boundary { fill: none; stroke: #6B7280; stroke-width: 2; stroke-dasharray: 8 6; }
    .l-rule    { fill: none; stroke: #E5E7EB; stroke-width: 2; }
    .l-data    { fill: none; stroke: #111827; stroke-width: 3.5; }
  </style>

  <defs>
    <marker id="arrow-data" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L16,8 L0,16 z" fill="#111827"/>
    </marker>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  </g>

  <g id="title">
    <text class="t-title" x="64" y="88">12.1 From empty AMI to production</text>
    <text class="t-subtitle" x="64" y="132">Every AWS step sits on a Linux foundation</text>
    <text class="t-fig" x="1536" y="88" text-anchor="end">Figure 12.1</text>
    <line class="l-rule" x1="64" y1="160" x2="1536" y2="160"/>
  </g>

  <g id="content">

    <!-- ===== endpoints ===== -->
    <text class="t-label-strong" x="64" y="212">Empty Ubuntu AMI</text>
    <text class="t-note" x="64" y="238">a frozen Linux — Phase 0 + 8</text>
    <text class="t-label-strong t-good" x="1536" y="212" text-anchor="end">Production service</text>
    <text class="t-note" x="1536" y="238" text-anchor="end">running, observed, hardened</text>

    <!-- ===== seven stage boxes, two rows ===== -->
    <!-- Row 1: stages 1-4 -->
    <!-- box geometry: w=336 h=132 ; x: 64, 424, 784, 1144 ; row1 y=272 -->

    <!-- 1 cloud-init -->
    <rect class="c-software" x="64" y="272" width="336" height="132" rx="10"/>
    <text class="t-box"   x="232" y="312" text-anchor="middle">1 · cloud-init / user-data</text>
    <text class="t-aws"   x="232" y="344" text-anchor="middle">boot-time config script</text>
    <text class="t-phase" x="232" y="384" text-anchor="middle">Phase 5 + 10</text>

    <!-- 2 access -->
    <rect class="c-software" x="424" y="272" width="336" height="132" rx="10"/>
    <text class="t-box"   x="592" y="312" text-anchor="middle">2 · User / SSH access</text>
    <text class="t-aws"   x="592" y="344" text-anchor="middle">keypair · SSM Session Mgr</text>
    <text class="t-phase" x="592" y="384" text-anchor="middle">Phase 7</text>

    <!-- 3 EBS mount -->
    <rect class="c-storage" x="784" y="272" width="336" height="132" rx="10"/>
    <text class="t-box"   x="952" y="312" text-anchor="middle">3 · EBS mount + fstab</text>
    <text class="t-aws"   x="952" y="344" text-anchor="middle">persistent storage · UUID</text>
    <text class="t-phase" x="952" y="384" text-anchor="middle">Phase 6</text>

    <!-- 4 package -->
    <rect class="c-software" x="1144" y="272" width="336" height="132" rx="10"/>
    <text class="t-box"   x="1312" y="312" text-anchor="middle">4 · Package install</text>
    <text class="t-aws"   x="1312" y="344" text-anchor="middle">apt / dpkg · dependencies</text>
    <text class="t-phase" x="1312" y="384" text-anchor="middle">Phase 8</text>

    <!-- Row 2: stages 5-7 ; y=500 -->
    <!-- 5 systemd -->
    <rect class="c-compute" x="64" y="500" width="336" height="132" rx="10"/>
    <text class="t-box"   x="232" y="540" text-anchor="middle">5 · systemd service</text>
    <text class="t-aws"   x="232" y="572" text-anchor="middle">enable --now · non-root</text>
    <text class="t-phase" x="232" y="612" text-anchor="middle">Phase 5 + 8</text>

    <!-- 6 observability -->
    <rect class="c-memory" x="424" y="500" width="336" height="132" rx="10"/>
    <text class="t-box"   x="592" y="540" text-anchor="middle">6 · Log / monitoring</text>
    <text class="t-aws"   x="592" y="572" text-anchor="middle">CloudWatch agent / Logs</text>
    <text class="t-phase" x="592" y="612" text-anchor="middle">Phase 4 + 11</text>

    <!-- 7 hardening -->
    <rect class="c-software" x="784" y="500" width="336" height="132" rx="10"/>
    <text class="t-box"   x="952" y="532" text-anchor="middle">7 · Hardening</text>
    <text class="t-aws"   x="952" y="562" text-anchor="middle">SG + host fw + IAM role</text>
    <text class="t-aws"   x="952" y="588" text-anchor="middle">+ AppArmor (MAC)</text>
    <text class="t-phase" x="952" y="620" text-anchor="middle">Phase 7 + 9</text>

    <!-- production endpoint box -->
    <rect class="c-memory" x="1144" y="500" width="336" height="132" rx="10"/>
    <text class="t-box t-good" x="1312" y="540" text-anchor="middle">Production</text>
    <text class="t-aws"   x="1312" y="572" text-anchor="middle">running · observed · defended</text>
    <text class="t-phase" x="1312" y="612" text-anchor="middle">the whole workbook</text>

    <!-- flow arrows row 1 (y=338) -->
    <line class="l-data" x1="400"  y1="338" x2="422"  y2="338" marker-end="url(#arrow-data)"/>
    <line class="l-data" x1="760"  y1="338" x2="782"  y2="338" marker-end="url(#arrow-data)"/>
    <line class="l-data" x1="1120" y1="338" x2="1142" y2="338" marker-end="url(#arrow-data)"/>
    <!-- wrap arrow: box4 down to box5 -->
    <line class="l-data" x1="1312" y1="404" x2="1312" y2="440" marker-end="url(#arrow-data)"/>
    <text class="t-note" x="1330" y="428" text-anchor="start">then</text>
    <path class="l-data" d="M1312 440 L1312 462 L232 462 L232 498" fill="none" marker-end="url(#arrow-data)"/>
    <!-- flow arrows row 2 (y=566) -->
    <line class="l-data" x1="400"  y1="566" x2="422"  y2="566" marker-end="url(#arrow-data)"/>
    <line class="l-data" x1="760"  y1="566" x2="782"  y2="566" marker-end="url(#arrow-data)"/>
    <line class="l-data" x1="1120" y1="566" x2="1142" y2="566" marker-end="url(#arrow-data)"/>

    <!-- ===== bottom lesson ===== -->
    <rect class="s-boundary" x="64" y="680" width="1416" height="88" rx="10"/>
    <text class="t-label-strong" x="772" y="716" text-anchor="middle">Every stage is a Linux fundamental wearing an AWS name.</text>
    <text class="t-note" x="772" y="748" text-anchor="middle">When a stage breaks, you don't debug "AWS" — you drop to its Linux layer and find the evidence (Phase 11).</text>

  </g>

  <g id="footer">
    <line class="l-rule" x1="64" y1="836" x2="1536" y2="836"/>
    <text class="t-sign" x="64" y="876" xml:space="preserve">Created by Denis Ergöçmen    GitHub: https://github.com/Denisergocmen924</text>
